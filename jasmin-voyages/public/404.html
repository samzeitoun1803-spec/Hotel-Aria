<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable — Jasmin Voyages</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #dde5e6 0%, #ebeae3 45%, #f6f2eb 80%);
        color: #0c1214;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 640px; }
      p.meta { margin: 0 0 24px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #66625a; }
      h1 { margin: 0; font-size: clamp(44px, 9vw, 88px); line-height: 0.92; letter-spacing: -0.045em; }
      h1 span { color: #b85c3c; }
      p.text { margin: 24px 0 36px; font-size: 18px; line-height: 1.6; color: #3a3833; }
      a.btn { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 28px; border-radius: 999px; background: #0c1214; color: #f6f2eb; font-weight: 600; text-decoration: none; }
      a.btn:hover { background: #1d2a2e; }
      a.btn:focus-visible { outline: 2px solid #b85c3c; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="meta">Jasmin Voyages — Nice</p>
      <h1>Cette page<br />s’est égarée<span>.</span></h1>
      <p class="text">Elle a peut-être changé d’adresse, ou n’a jamais existé. Le reste du monde, lui, vous attend toujours.</p>
      <a class="btn" href="/">Retour à l’accueil →</a>
    </main>
  </body>
</html>
