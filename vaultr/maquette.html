<title>Vaultr</title>
<meta name="theme-color" content="#0B0D0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: une seule colonne "téléphone" (plein écran sur mobile, cadre centré sur ordinateur),
   écran d'accueil blanc qui s'ouvre comme une porte de coffre sur l'appli noir + vert clair. */
:root{
  --ink:#0B0D0A;        /* fond de l'appli, noir teinté vert */
  --panel:#141812;      /* surfaces */
  --panel-2:#1C2219;    /* surfaces surélevées */
  --line:#2A3326;       /* filets */
  --fg:#F1F6EC;         /* texte */
  --muted:#93A08C;      /* texte secondaire */
  --volt:#C6FF4D;       /* vert clair : argent récupéré, actions */
  --volt-dim:#C6FF4D22;
  --loss:#FF5C4D;       /* rouge, réservé à l'argent non récupéré */
  --paper:#FFFFFF;      /* écran d'accueil */
  --stage:#060705;      /* fond autour du téléphone */
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:6px}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-block:24px;padding-inline:16px}
.phone{position:relative;width:100%;max-width:400px;height:min(840px,calc(100vh - 48px));background:var(--ink);border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px #1d231a,0 30px 80px #000c;display:flex;flex-direction:column}
.side{max-width:300px;color:var(--muted);font-size:14px}
.side h1{font-family:var(--display);font-stretch:118%;font-weight:900;font-style:italic;color:var(--fg);font-size:44px;line-height:.95;margin:0 0 12px;letter-spacing:-.01em}
.side h1 span{color:var(--volt)}
.side p{margin:0 0 12px}
.side .demo-tip{border-left:2px solid var(--volt);padding-left:12px;color:var(--fg)}
@media (max-width:860px){.side{display:none}}
@media (max-width:480px){
  .stage{padding:0;display:block;height:100%}
  .phone{max-width:none;height:100%;border-radius:0;box-shadow:none}
}

/* ---------- Écran d'accueil blanc / porte de coffre ---------- */
.splash{position:absolute;inset:0;z-index:50;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.splash.open{clip-path:circle(0% at 50% 44%);pointer-events:none}
.dial{width:150px;height:150px;position:relative}
.dial svg{width:100%;height:100%;animation:spin 1.6s cubic-bezier(.6,0,.2,1) both}
.wordmark{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:125%;font-size:46px;letter-spacing:-.02em;line-height:1}
.wordmark i{font-style:italic;color:#7DB800}
.splash small{font-size:13px;color:#555;letter-spacing:.14em;text-transform:uppercase}
@keyframes spin{from{transform:rotate(-200deg)}to{transform:rotate(0)}}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 8px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.brand{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:125%;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--volt)}
.role-switch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;font-size:12px;font-weight:600}
.role-switch button{padding:6px 11px;border-radius:999px;color:var(--muted)}
.role-switch button[aria-pressed="true"]{background:var(--volt);color:var(--ink)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 24px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.screen{display:flex;flex-direction:column;gap:16px}
.screen.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

h2{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:16px;margin:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Coffre ---------- */
.vault{position:relative;display:grid;place-items:center;padding:8px 0 4px}
.vault svg{width:240px;height:240px;max-width:100%}
.vault .ring-bg{fill:none;stroke:var(--panel-2);stroke-width:16}
.vault .ring{fill:none;stroke:var(--volt);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.3,.9,.3,1);filter:drop-shadow(0 0 8px #C6FF4D66)}
.vault .ticks line{stroke:var(--line);stroke-width:2}
.vault .door{transform-origin:120px 120px;transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.vault-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.vault-center .amount{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:108%;font-size:38px;line-height:1;color:var(--volt);font-variant-numeric:tabular-nums}
.vault-center .of{font-size:13px;color:var(--muted);margin-top:4px}
.vault-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-stretch:110%;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat.loss b{color:var(--loss)}

/* ---------- Listes d'exercices ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.task.weak{border-color:#C6FF4D55}
.task .name{font-weight:600;min-width:0}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.price{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:112%;font-size:20px;color:var(--volt);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--volt);border-radius:6px;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.task-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.chip.volt{background:var(--volt-dim);color:var(--volt)}
.chip.wait{background:#FFC94D1f;color:#FFC94D}
.chip.loss{background:#FF5C4D1f;color:var(--loss)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--panel-2);border:1px solid var(--line);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--volt);color:var(--ink);border-color:var(--volt)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-style:italic;background:var(--panel-2);border:2px solid var(--line);color:var(--fg)}
.avatar.volt{border-color:var(--volt);color:var(--volt)}
.split{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hr{height:1px;background:var(--line)}
.note{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:12px;padding:10px 12px}
.note b{color:var(--fg)}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.search input::placeholder{color:var(--muted)}
.tabs-inline{display:flex;gap:6px;flex-wrap:wrap}
.tabs-inline button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs-inline button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}

.proof-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted);font-size:13px;max-width:100%}

/* ---------- Barre d'onglets ---------- */
nav.tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:#0B0D0Af2;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button[aria-current="page"]{color:var(--volt)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--volt);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* ---------- Feuilles / modales ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:30;background:#000a;display:flex;align-items:flex-end;animation:fade .2s ease both}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.9,.3,1) both}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input[type=text],.field input[type=number],.field select{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input[type=range]{width:100%;accent-color:var(--volt)}
.big-amount{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:118%;font-size:52px;line-height:1;color:var(--volt);text-align:center;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.edit-task{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;background:var(--panel-2);border-radius:14px;padding:10px 12px}
.edit-task input{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.edit-task .meta{font-size:12px;color:var(--muted)}
.budget{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px}
.budget.ok{background:var(--volt-dim);color:var(--volt)}
.budget.ko{background:#FF5C4D1f;color:var(--loss)}

/* ---------- Toast + pièces ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:60;background:var(--volt);color:var(--ink);font-weight:700;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #000a;animation:toast 2.6s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(10px)}}
.coin{position:absolute;z-index:55;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EFFFC2,var(--volt) 55%,#7DB800);box-shadow:0 0 10px #C6FF4D99;pointer-events:none;display:grid;place-items:center;font:900 12px/1 var(--display);color:var(--ink)}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.role-pick{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.role-card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.role-card:hover{border-color:var(--volt);transform:translateY(-2px)}
.role-card b{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:118%;font-size:24px}
.role-card span{color:var(--muted);font-size:14px}
.hero-line{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:120%;font-size:38px;line-height:.95;letter-spacing:-.02em;margin:14px 0 0}
.hero-line em{font-style:italic;color:var(--volt)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- Encaissement : animation quand le sportif reçoit de l'argent ---------- */
.cele{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 42%,#1d2b10 0%,#0B0D0Af0 62%);animation:fade .25s ease both;overflow:hidden}
.cele-rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,#C6FF4D1c 0deg 9deg,transparent 9deg 22deg);border-radius:50%;animation:rays 9s linear infinite;mask-image:radial-gradient(circle,#000 0 30%,transparent 62%);-webkit-mask-image:radial-gradient(circle,#000 0 30%,transparent 62%)}
@keyframes rays{to{transform:rotate(360deg)}}
.cele-card{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px;animation:celeIn .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes celeIn{from{transform:scale(.4) translateY(40px);opacity:0}}
.cele-vault{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--volt);color:var(--ink);box-shadow:0 0 0 10px #C6FF4D22,0 0 60px #C6FF4D88;animation:celeDial 1.1s cubic-bezier(.3,1.4,.4,1) both .1s}
.cele-vault svg{width:60px;height:60px}
@keyframes celeDial{from{transform:rotate(-260deg) scale(.6)}}
.cele-amt{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:122%;font-size:68px;line-height:1;color:var(--volt);font-variant-numeric:tabular-nums;text-shadow:0 0 30px #C6FF4D88;letter-spacing:-.02em}
.cele-lines{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg);max-height:120px;overflow:auto}
.cele-lines span{color:var(--muted)}
.cele .btn{margin-top:10px}
.cele.out .cele-card{animation:celeOut .45s cubic-bezier(.6,0,.4,1) both}
.cele.out{animation:fadeOut .45s ease both .15s}
@keyframes celeOut{to{transform:translateY(-120px) scale(.3);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.rain{position:absolute;top:-30px;z-index:1;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EFFFC2,var(--volt) 55%,#7DB800);box-shadow:0 0 10px #C6FF4D88;display:grid;place-items:center;font:900 12px/1 var(--display);color:var(--ink);pointer-events:none}
.vault.boom .ring{filter:drop-shadow(0 0 22px #C6FF4D)}

/* ---------- Divers app ---------- */
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.top-right{display:flex;align-items:center;gap:8px}
.mode-pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:#FFC94D;border-radius:999px;padding:3px 8px}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt);background:var(--volt-dim)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--volt);width:18px;height:18px}
.err{color:var(--loss);font-size:13px;min-height:1em}
.del{color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}
.edit-task{grid-template-columns:1fr 84px auto}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}
.copy{display:flex;gap:8px;align-items:center}
.copy code{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--volt);overflow:hidden;text-overflow:ellipsis}
.vid-wrap{position:relative}
.vid-play{position:absolute;inset:auto 12px 12px auto;display:inline-flex;align-items:center;gap:8px;background:#0B0D0Ae6;border:1px solid var(--volt);color:var(--volt);border-radius:999px;padding:8px 14px 8px 8px;font-weight:700;font-size:13px}
.vid-play span{width:26px;height:26px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;font-size:11px}
video.proof-img{background:#000;object-fit:contain}

/* ---------- Messagerie ---------- */
.chat-screen{gap:0;min-height:100%}
.chat-head{position:sticky;top:-4px;margin-top:-4px;z-index:2;display:flex;align-items:center;gap:12px;padding:8px 0 12px;background:var(--ink);border-bottom:1px solid var(--line)}
.chat-head .avatar{width:40px;height:40px}
.msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:14px 0 10px}
.day{display:flex;justify-content:center;margin:10px 0 4px}
.day span{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.bubble{max-width:80%;padding:8px 11px 6px;border-radius:16px;font-size:15px;line-height:1.35;animation:bub .25s cubic-bezier(.2,1.3,.4,1) both;overflow-wrap:anywhere}
.bubble.them{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:5px}
.bubble.me{align-self:flex-end;background:var(--volt);color:var(--ink);border-bottom-right-radius:5px}
.bubble .meta{display:flex;justify-content:flex-end;gap:4px;font-size:10px;opacity:.65;margin-top:2px;font-variant-numeric:tabular-nums}
.bubble .ticks{letter-spacing:-3px;padding-right:3px}
.bubble .ticks.seen{opacity:1;font-weight:900}
@keyframes bub{from{transform:translateY(6px) scale(.96);opacity:0}}
.seen-line{align-self:flex-end;font-size:11px;color:var(--muted);margin-top:-2px}
.chat-empty{margin:auto;text-align:center;color:var(--fg);padding:40px 10px;line-height:1.6}
.composer{position:sticky;bottom:-24px;margin-bottom:-24px;display:flex;gap:8px;align-items:center;padding:10px 0 34px;background:var(--ink)}
.composer input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:11px 16px}
.composer input::placeholder{color:var(--muted)}
.send{width:44px;height:44px;flex:none;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;transition:transform .12s}
.send:active{transform:scale(.9)}
.send svg{width:20px;height:20px}
.chat-row{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);width:100%}
.chat-row .preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-row.unread .preview{color:var(--fg);font-weight:600}
.chat-row .dot{width:10px;height:10px;border-radius:50%;background:var(--volt);flex:none;box-shadow:0 0 8px #C6FF4D}
.chat-list{gap:0}
.chat-row .grow{flex:1;min-width:0}

/* ---------- Connexion ---------- */
.auth{gap:18px}
.auth-hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-top:10px}
.auth-dial{width:64px;height:64px;box-shadow:0 0 0 8px #C6FF4D1a,0 0 40px #C6FF4D55}
.auth-dial svg{width:40px;height:40px}
.auth-actions{display:flex;flex-direction:column;gap:10px}
.btn.big{padding:15px 16px;font-size:16px;border-radius:14px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo-accounts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field input[type=email],.field input[type=password],.pw input{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.pw{position:relative;display:flex}
.pw input{padding-right:84px}
.pw .link{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.link{color:var(--volt);font-weight:600;font-size:13px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.center{text-align:center;margin:0}
.check.small{font-size:13px;align-items:flex-start;color:var(--muted)}
.check.small input{margin-top:1px;flex:none}
.err.info{color:var(--volt)}
.btn.danger{color:var(--loss);border-color:#FF5C4D55}
.btn.danger-fill{background:var(--loss);border-color:var(--loss);color:#fff}
.danger-box{border-color:#FF5C4D55}

/* ---------- Pages coach ---------- */
img.avatar{object-fit:cover;padding:0}
.avatar.xl{width:84px;height:84px;font-size:28px;border-width:3px}
.cc-main{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-width:0}
.cc-main .grow{flex:1;min-width:0}
.star1,.stars{color:var(--volt);letter-spacing:1px;font-style:normal}
.ai-card{flex-direction:row;align-items:center;gap:12px;border-style:dashed}
.coach-page{display:flex;flex-direction:column;gap:16px}
.coach-page.self{border:1px dashed var(--line);border-radius:20px;padding:14px}
.cp-hero{display:flex;align-items:center;gap:16px}
.cp-id{min-width:0}
.cp-id h2{font-size:24px}
.cp-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cp-facts div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.cp-facts b{font-family:var(--display);font-stretch:110%;font-size:17px}
.cp-facts span{font-size:11px;color:var(--muted)}
.cp-actions{flex-wrap:wrap}
.cp-sec{display:flex;flex-direction:column;gap:10px;padding-top:4px;border-top:1px solid var(--line)}
.cp-sec h3{padding-top:12px}
.bio{margin:0;white-space:pre-line;line-height:1.55}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg)}
.place{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.place .pi{font-size:20px;width:36px;height:36px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;flex:none}
.av-grid{display:grid;grid-template-columns:48px repeat(7,1fr);gap:4px;align-items:center}
.av-h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.av-s{font-size:11px;color:var(--muted)}
.av-c{height:26px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line)}
.av-c.on{background:var(--volt);border-color:var(--volt);box-shadow:0 0 8px #C6FF4D55}
.av-grid.edit .av-c{height:34px;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal-item{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--panel-2);padding:0}
.gal-item img{width:100%;height:100%;object-fit:cover;display:block}
.gal-del{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:#000c;color:#fff;font-size:16px;line-height:1}
.gal-add{aspect-ratio:1;border-radius:12px;border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;cursor:pointer}
.gal-add span{font-size:26px;color:var(--volt);line-height:1}
.gal-big{width:100%;border-radius:14px;max-height:70vh;object-fit:contain;background:#000}
.rating-sum{display:flex;gap:16px;align-items:center}
.rating-sum .big{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}
.rating-sum .big b{font-family:var(--display);font-style:italic;font-weight:900;font-size:38px;line-height:1;color:var(--volt)}
.rating-sum .bars{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.bar-row{display:grid;grid-template-columns:12px 1fr 20px;gap:8px;align-items:center;font-size:12px}
.bar-row .bar{grid-column:auto;height:6px}
.review{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.review p{margin:0;font-size:14px;line-height:1.5}
.star-pick{display:flex;gap:4px}
.star-pick button{font-size:30px;line-height:1;color:var(--line);transition:transform .12s,color .15s}
.star-pick button.on{color:var(--volt)}
.star-pick button:active{transform:scale(1.2)}
textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;font:inherit;color:inherit;resize:vertical}
textarea::placeholder{color:var(--muted)}
.tog{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--volt);color:var(--volt);background:var(--volt-dim)}
.place-edit{display:grid;grid-template-columns:118px 1fr auto;gap:6px;align-items:center}
.place-edit select,.place-edit input{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 8px;width:100%;min-width:0}
.edit-bar{position:sticky;top:-4px;z-index:2;background:var(--ink);padding:6px 0;align-items:center}
.preview-bar{border-color:#C6FF4D55}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi b{font-family:var(--display);font-stretch:112%;font-size:24px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hot{border-color:var(--volt)}
.kpi.hot b{color:var(--volt)}
.ai-wait{border-color:#C6FF4D55}
.dots,.bubble.typing{display:flex;gap:5px;align-items:center}
.bubble.typing{padding:12px 14px}
.dots span,.bubble.typing span{width:8px;height:8px;border-radius:50%;background:var(--volt);animation:blink 1.2s infinite ease-in-out}
.bubble.typing span{background:var(--muted)}
.dots span:nth-child(2),.bubble.typing span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3),.bubble.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

/* ---------- Questionnaire Vaultr ---------- */
.quiz{gap:18px}
.quiz .bar{height:8px}
.q-head{display:flex;align-items:center;gap:12px}
.q-head .avatar{width:40px;height:40px}
.q-title{font-size:26px;line-height:1.1}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;font-size:15px;font-weight:600;transition:border-color .15s,background .15s,transform .12s}
.q-opt:active{transform:scale(.98)}
.q-opt.on{border-color:var(--volt);background:var(--volt-dim);color:var(--volt)}
.q-opts.multi{display:grid;grid-template-columns:1fr 1fr}
.q-check{width:22px;height:22px;flex:none;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px}
.q-opt.on .q-check{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.ai-note{grid-column:1/-1;font-size:13px;line-height:1.45;background:var(--volt-dim);color:var(--fg);border-radius:12px;padding:9px 11px}
.ai-note b{color:var(--volt)}
.ai-note.ko{background:#FF5C4D1a}
.ai-note.ko b{color:var(--loss)}
.resume-card{flex-direction:row;align-items:center;gap:12px;border-color:var(--volt)}
@media (max-width:360px){.q-opts.multi{grid-template-columns:1fr}}

/* ---------- Coffre : la mise d'abord ---------- */
.vault-center .of.top{margin:0 0 2px;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:600}
.rec-small{margin-top:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.rec-small span{color:var(--volt);font-weight:700;font-variant-numeric:tabular-nums}
.goal-line{margin:0;text-align:center;font-size:14px;color:var(--muted)}
.goal-line b{color:var(--fg)}
.goal-line.win{color:var(--volt)}
.cele-left{font-size:14px;color:var(--muted);margin-top:4px}
.cele-left b{color:var(--fg)}

/* ---------- Cartes d'exercice ---------- */
.task.t2{grid-template-columns:76px 1fr auto;align-items:start}
.task.t2.full{opacity:.75}
.exo-thumb{width:76px;height:76px;border-radius:16px;background:radial-gradient(circle at 50% 30%,#24321B,#0E120C 75%);border:1px solid var(--line);overflow:hidden;position:relative;padding:0;display:grid;place-items:center}
.exo-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.exo-thumb .exo{width:100%;height:100%}
.play{position:absolute;inset:auto;width:30px;height:30px;border-radius:50%;background:#0B0D0Ad9;border:1.5px solid var(--volt);color:var(--volt);display:grid;place-items:center;font-size:12px;z-index:1}
.play.big{width:64px;height:64px;font-size:24px}
.t2-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.t2-prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.t2-prog b{font-family:var(--display);font-stretch:110%;font-size:18px;color:var(--fg)}
.val-chip{font-size:11px;font-weight:700;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.task.t2 .bar{grid-column:1/-1}
.howto-media{width:100%;aspect-ratio:4/3;border-radius:18px;object-fit:cover;background:#000;display:grid;place-items:center;position:relative;overflow:hidden;max-width:100%}
.howto-media.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.howto-media.vid{cursor:pointer}
.exo-big{background:radial-gradient(circle at 50% 30%,#2A3A1F,#0E120C 75%);border:1px solid var(--line)}
.exo-big .exo{width:78%;height:78%}
.howto-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.howto-steps div{background:var(--panel-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.howto-steps b{font-family:var(--display);font-stretch:112%;font-size:22px}
.howto-steps span{font-size:12px;color:var(--muted)}
.tmedia{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--volt);cursor:pointer;padding:2px 0}
.tmedia.on{color:var(--muted)}
.tmedia.busy{opacity:.6;pointer-events:none}

/* illustrations animées */
.exo polyline,.exo line{stroke:var(--volt);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.exo .hd{fill:var(--volt)}
.exo .gd,.exo .gd2{stroke:#33402C;stroke-width:3}
.exo polyline.gd{stroke-width:4}
.exo .rope{fill:none;stroke:#F1F6EC66;stroke-width:2;stroke-dasharray:6 6}
.exo .shadow{fill:#000000aa}
.exo .wh{fill:none;stroke:var(--volt);stroke-width:4}
.exo .wave{fill:none;stroke:#4DD9FF;stroke-width:3;stroke-linecap:round}
.exo .bar{stroke:#F1F6EC}
.exo .db{fill:#F1F6EC}
.exo .glove{fill:#FF5C4D}
.exo .tm-bg{fill:none;stroke:#33402C;stroke-width:4}
.exo .tm{fill:none;stroke:var(--volt);stroke-width:4;stroke-dasharray:76;transform:rotate(-90deg);transform-origin:50px 28px}
.exo g,.exo ellipse,.exo circle{transform-box:view-box}
.a-bob{animation:exBob 1.4s ease-in-out infinite}
.a-bob-fast{animation:exBob .45s ease-in-out infinite}
.a-press{animation:exPress 1.4s ease-in-out infinite}
.a-hip{animation:exHip 1.6s ease-in-out infinite}
.a-jump{animation:exJump .7s ease-in-out infinite}
.a-shadow{transform-box:fill-box;transform-origin:center;animation:exShadow .7s ease-in-out infinite}
.a-rope{animation:exRope .7s linear infinite}
.a-spin{animation:exSpin 1s linear infinite}
.flow{animation:exFlow .6s linear infinite}
.flow.slow{animation-duration:1.2s}
.a-punch{animation:exPunch 1s ease-in-out infinite}
.a-sway{animation:exSway 1.6s ease-in-out infinite}
.a-sway-slow{animation:exSway2 3.2s ease-in-out infinite}
.a-swim{animation:exSwim 1.4s ease-in-out infinite}
.a-pull{animation:exPull 1.6s ease-in-out infinite}
.a-lift{animation:exBob 1.4s ease-in-out infinite}
.a-climb{animation:exClimb 2.6s linear infinite}
.a-timer{animation:exTimer 3s linear infinite}
@keyframes exBob{50%{transform:translateY(6px)}}
@keyframes exPress{50%{transform:rotate(7deg)}}
@keyframes exHip{50%{transform:rotate(14deg)}}
@keyframes exJump{50%{transform:translateY(-12px)}}
@keyframes exShadow{50%{transform:scale(.6)}}
@keyframes exRope{to{stroke-dashoffset:-24}}
@keyframes exSpin{to{transform:rotate(360deg)}}
@keyframes exFlow{to{transform:translateX(-20px)}}
@keyframes exPunch{0%,100%{transform:translateX(-12px)}40%{transform:translateX(4px)}}
@keyframes exSway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes exSway2{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes exSwim{50%{transform:rotate(-14deg)}}
@keyframes exPull{0%,100%{transform:translateY(12px)}50%{transform:translateY(0)}}
@keyframes exClimb{0%{transform:translate(0,0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate(40px,-30px);opacity:0}}
@keyframes exTimer{from{stroke-dashoffset:76}to{stroke-dashoffset:0}}

/* ---------- Mise : la jauge qui chauffe ---------- */
.mise-stage{--p:.2;--amp:0;--crack:0;display:flex;flex-direction:column;gap:16px;padding:6px 0}
.mise-stage .big-amount{transform:scale(calc(1 + var(--p) * .4));transition:transform .15s;color:var(--volt);color:color-mix(in srgb,#FF2D1F calc(var(--p) * 100%),var(--volt))}
.mise-stage.max .big-amount{animation:pulseBig .5s ease-in-out infinite}
@keyframes pulseBig{50%{text-shadow:0 0 30px #FF2D1F}}
.meter{position:relative;height:24px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.mise-stage.hot .meter{animation:meterShake .11s linear infinite}
@keyframes meterShake{0%{transform:translate(calc(var(--amp) * 1px),0)}25%{transform:translate(calc(var(--amp) * -1px),calc(var(--amp) * .6px))}50%{transform:translate(calc(var(--amp) * .6px),calc(var(--amp) * -1px))}75%{transform:translate(calc(var(--amp) * -.6px),calc(var(--amp) * .5px))}}
.meter-fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p) * 100%);min-width:24px;border-radius:999px;background:linear-gradient(90deg,#FFB020,#FF5A1F 55%,#FF1A1A);box-shadow:0 0 calc(var(--p) * 36px) calc(var(--p) * 5px) rgba(255,40,20,calc(var(--p) * .85));overflow:hidden}
.meter-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 10px,rgba(255,255,255,.22) 10px 16px);animation:meterFlow .9s linear infinite}
.mise-stage.hot .meter-fill::after{animation-duration:.35s}
@keyframes meterFlow{to{transform:translateX(-19px)}}
.cracks{position:absolute;inset:-10px 0;width:100%;height:44px;opacity:var(--crack);pointer-events:none}
.cracks polyline{fill:none;stroke:#FFFFFF;stroke-width:1.6;vector-effect:non-scaling-stroke}
.meter input[type=range]{position:absolute;left:-4px;right:-4px;top:-10px;width:calc(100% + 8px);height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
.meter input[type=range]::-webkit-slider-runnable-track{background:transparent;height:44px}
.meter input[type=range]::-moz-range-track{background:transparent;height:44px}
.meter input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:5px;border-radius:50%;background:#fff;border:4px solid #FF3B2F;box-shadow:0 0 0 calc(var(--p) * 12px) rgba(255,59,47,.25),0 4px 12px #000a}
.meter input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid #FF3B2F;box-shadow:0 0 0 calc(var(--p) * 12px) rgba(255,59,47,.25)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:3;box-shadow:0 0 6px #FFB020}
.mise-phrase{min-height:44px;text-align:center;font-weight:800;font-size:17px;line-height:1.3;font-family:var(--display);font-stretch:105%}
.mise-stage.hot .mise-phrase{color:#FF8A5C}
.mise-stage.max .mise-phrase{color:#FF3B2F}

/* ---------- Page coach ---------- */
.coach-page{gap:14px}
.cp-cover{position:relative;height:150px;border-radius:22px;overflow:hidden;margin:0 -2px;background:var(--panel-2)}
.cover-svg,.cover-img{width:100%;height:100%;display:block;object-fit:cover}
.cv-float{animation:cvFloat 9s ease-in-out infinite;animation-delay:calc(var(--i) * -2s);transform-box:fill-box;transform-origin:center}
@keyframes cvFloat{50%{transform:translate(18px,-10px) scale(1.12)}}
.cp-flag{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;background:#0B0D0Acc;color:var(--volt);border-radius:999px;padding:4px 9px}
.cp-head{display:flex;align-items:flex-end;gap:14px;margin-top:-52px;padding-left:12px;position:relative}
.cp-head .avatar.xl{border:4px solid var(--ink);box-shadow:0 0 0 2px var(--volt)}
.cp-id{min-width:0;padding-bottom:4px}
.cp-id h2{font-size:24px}
.cp-sub{font-size:13px;color:var(--muted)}
.pro-tag{font:700 10px var(--body);letter-spacing:.1em;color:var(--ink);background:var(--volt);border-radius:6px;padding:2px 6px;vertical-align:middle}
.cp-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.cp-meta b{color:var(--fg);font-family:var(--display);font-stretch:108%;font-size:15px}
.cp-sec{gap:12px;border-top:none;padding-top:6px}
.cp-label{font-family:var(--body);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);display:flex;align-items:center;gap:10px;padding-top:8px}
.cp-label::after{content:"";flex:1;height:1px;background:var(--line)}
.specs{margin:0;font-size:14px;color:var(--volt);font-weight:600}
.gal.strip{grid-template-columns:repeat(3,1fr)}
.coach-card{padding:0;overflow:hidden;gap:0}
.coach-card>*:not(.cc-cover){margin:0 16px}
.coach-card>.row:last-child{margin-bottom:14px}
.coach-card .cc-main{margin-top:12px;margin-bottom:10px}
.coach-card>.row{margin-bottom:10px}
.cc-cover{height:70px;padding:0;display:block;width:100%;overflow:hidden}
.cover-prev{height:110px;border-radius:16px;overflow:hidden}
.cover-opts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cover-opt{height:40px;border-radius:10px;overflow:hidden;padding:0;border:2px solid transparent}
.cover-opt.on{border-color:var(--volt)}

/* carte des lieux */
.map-card{position:relative;height:190px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.map{width:100%;height:100%;display:block}
.map-bg{fill:#10140E}
.map-pan{animation:mapPan 16s ease-in-out infinite alternate;transform-origin:200px 110px}
@keyframes mapPan{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.12) translate(-14px,-8px)}}
.map .st{fill:none;stroke:#222A1E;stroke-width:3}
.map .st.main{stroke:#2F3B28;stroke-width:8}
.map .park{fill:#16301A}
.map .sea{fill:#0E2730}
.map .sea-line{fill:none;stroke:#4DD9FF55;stroke-width:2;stroke-dasharray:10 8;animation:seaMove 4s linear infinite}
@keyframes seaMove{to{stroke-dashoffset:-36}}
.map .route{fill:none;stroke:var(--volt);stroke-width:2.5;stroke-dasharray:6 6;opacity:.8;animation:seaMove 2s linear infinite}
.map .pulse{fill:#C6FF4D33;transform-box:fill-box;transform-origin:center;animation:pinPulse 2.2s ease-out infinite}
@keyframes pinPulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.4);opacity:0}}
.map .drop{animation:pinDrop .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pinDrop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.map .pin-s{fill:var(--volt);stroke:#0B0D0A;stroke-width:2}
.map .pin-n{fill:#0B0D0A;font:900 11px var(--display);text-anchor:middle}

.map-city{position:absolute;left:10px;bottom:10px;font-size:12px;font-weight:700;background:#0B0D0Acc;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.places-list{display:flex;flex-direction:column;gap:6px}
.place .pn{width:26px;height:26px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;font:900 12px var(--display);flex:none}
.remote{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

<script>
(() => {
  /* =====================================================================
     Outils
     ===================================================================== */
  const euro = n => { const v = Math.round((n || 0) * 100) / 100; return v.toLocaleString("fr-FR", { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 }) + " €"; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
  const first = n => (n || "").trim().split(/\s+/)[0] || "";
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const now = () => Date.now();
  const monthName = () => new Date().toLocaleDateString("fr-FR", { month: "long" });
  const daysLeft = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate(); };
  const cleanHandle = h => (h || "").toLowerCase().replace(/^@/, "").replace(/[^a-z0-9._]/g, "").slice(0, 20);
  const earned = t => t.earned ?? t.value * t.done;            // argent déjà rendu sur cet exercice (acquis)
  const recovered = p => (p?.tasks || []).reduce((a, t) => a + earned(t), 0);
  const left = t => Math.max(0, t.target - t.done);              // séances encore à valider
  // Empreinte du mot de passe pour la démo (comptes gardés sur l'appareil uniquement)
  function pwHash(email, pw) {
    const str = email.toLowerCase() + ":" + pw; let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
  }
  const emailKey = e => e.trim().toLowerCase().replace(/[^a-z0-9_\-.~:@+]/g, "_").slice(0, 190);
  const SPORTS = ["Remise en forme", "Musculation", "Course à pied", "Yoga & mobilité", "Boxe", "Pilates", "Natation", "Autre"];
  const DAYS = [["mon", "Lun"], ["tue", "Mar"], ["wed", "Mer"], ["thu", "Jeu"], ["fri", "Ven"], ["sat", "Sam"], ["sun", "Dim"]];
  const SLOTS = [["am", "Matin"], ["noon", "Midi"], ["pm", "Aprèm"], ["eve", "Soir"]];
  const PLACE_TYPES = { gym: ["🏋️", "En salle"], home: ["🏠", "À domicile"], outdoor: ["🌳", "En extérieur"], online: ["💻", "En visio"] };
  const SPECIALTIES = ["Perte de poids", "Prise de muscle", "Remise en forme", "Cardio", "Mobilité", "Préparation physique", "Course à pied", "Post-grossesse", "Seniors", "Nutrition"];

  // Le coach IA « Vaultr » : attribué d'office à chaque sportif, il n'existe pas dans la base.
  const AI_ID = "vaultr_ai";
  const AI_PHOTO = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#C6FF4D"/><circle cx="50" cy="50" r="30" fill="none" stroke="#0B0D0A" stroke-width="7"/><g stroke="#0B0D0A" stroke-width="8" stroke-linecap="round"><line x1="50" y1="50" x2="50" y2="28"/><line x1="50" y1="50" x2="69" y2="61"/><line x1="50" y1="50" x2="31" y2="61"/></g><circle cx="50" cy="50" r="8" fill="#0B0D0A"/></svg>');
  const AI_COACH = {
    id: AI_ID, ai: true, role: "coach", name: "Vaultr", handle: "vaultr", city: "Partout, 24h/24", sport: "Coach IA", price: 0, photo: AI_PHOTO, trial: false,
    bio: "Je suis Vaultr, le coach IA de l'appli. Je crée ton programme selon ton objectif, je répartis ta mise sur tes exercices et je vérifie tes photos et vidéos en quelques secondes. Gratuit, disponible jour et nuit. Quand tu veux passer à un coach humain, choisis-en un dans la liste.",
    specialties: ["Tous objectifs", "Programme sur mesure", "Validation en quelques secondes"],
    places: [{ type: "online", label: "Dans ton téléphone" }],
    availability: Object.fromEntries(DAYS.map(([d]) => [d, SLOTS.map(([x]) => x)])), experience: "", diplomas: ""
  };
  const hashStr = str => { let h = 2166136261; for (const ch of String(str)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rng = seed => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  // Illustrations animées des exercices (dessinées en SVG, une par famille de mouvement)
  const EXO_KINDS = [["pullup", /traction|suspension/], ["pushup", /pompe/], ["plank", /gainage|planche/], ["bridge", /pont/], ["lunge", /fente/],
    ["squat", /squat|chaise/], ["jump", /corde|jumping|saut|burpee/], ["bike", /vélo|velo|elliptique/], ["swim", /natation|nage|piscine/],
    ["box", /box|shadow|frappe/], ["dance", /danse/], ["yoga", /yoga|mobilit|étirement|stretch/], ["stairs", /escalier/],
    ["run", /course|fractionn|footing|running|sprint|montées de genoux|cours/], ["walk", /marche|rando/], ["weights", /haltère|développé|rowing|curl|muscu|élastique/]];
  const exoKind = name => (EXO_KINDS.find(([, re]) => re.test((name || "").toLowerCase())) || ["generic"])[0];
  function exoSVG(kind) {
    const P = pts => `<polyline points="${pts}"/>`, H = (x, y) => `<circle class="hd" cx="${x}" cy="${y}" r="6.5"/>`;
    const gd = `<line class="gd" x1="6" y1="90" x2="94" y2="90"/>`;
    const flow = `<g class="flow">${[-20, 0, 20, 40, 60, 80, 100].map(x => `<line class="gd2" x1="${x}" y1="95" x2="${x + 9}" y2="95"/>`).join("")}</g>`;
    const F = {
      squat: `${gd}<g class="a-bob">${H(46, 26)}${P("47,33 45,54")}${P("46,40 66,44")}${P("45,54 60,62 56,88")}${P("45,54 53,65 47,88")}</g>`,
      lunge: `${gd}<g class="a-bob">${H(50, 22)}${P("50,29 50,54")}${P("50,36 42,48")}${P("50,36 58,48")}${P("50,54 64,66 66,88")}${P("50,54 38,72 26,88")}</g>`,
      pushup: `${gd}<g class="a-press" style="transform-origin:18px 86px">${H(80, 52)}${P("18,86 72,58")}${P("70,60 72,88")}${P("62,63 60,88")}</g>`,
      plank: `${gd}${H(80, 60)}${P("16,86 72,68")}${P("70,69 70,86 82,86")}<circle class="tm-bg" cx="50" cy="28" r="12"/><circle class="tm a-timer" cx="50" cy="28" r="12"/>`,
      bridge: `${gd}${H(14, 82)}${P("20,85 34,85")}<g class="a-hip" style="transform-origin:34px 85px">${P("34,85 54,64 70,66 74,88")}</g>`,
      run: `${gd}${flow}<g class="a-bob-fast">${H(57, 20)}${P("57,27 50,50")}${P("55,33 65,42 73,36")}${P("55,33 45,42 38,52")}${P("50,50 62,62 58,84")}${P("50,50 40,64 26,64")}</g>`,
      walk: `${gd}<g class="flow slow">${[-20, 0, 20, 40, 60, 80, 100].map(x => `<line class="gd2" x1="${x}" y1="95" x2="${x + 9}" y2="95"/>`).join("")}</g><g class="a-bob">${H(50, 18)}${P("50,25 50,52")}${P("50,31 58,44 60,52")}${P("50,31 42,44 40,52")}${P("50,52 58,70 60,88")}${P("50,52 44,70 40,88")}</g>`,
      jump: `<ellipse class="rope a-rope" cx="50" cy="50" rx="32" ry="40"/><ellipse class="shadow a-shadow" cx="50" cy="92" rx="15" ry="3"/><g class="a-jump">${H(50, 22)}${P("50,29 50,54")}${P("50,34 34,22")}${P("50,34 66,22")}${P("50,54 40,82")}${P("50,54 60,82")}</g>`,
      bike: `${gd}<g class="a-spin" style="transform-origin:28px 72px"><circle class="wh" cx="28" cy="72" r="14"/><line x1="28" y1="60" x2="28" y2="84"/><line x1="16" y1="72" x2="40" y2="72"/></g><g class="a-spin" style="transform-origin:74px 72px"><circle class="wh" cx="74" cy="72" r="14"/><line x1="74" y1="60" x2="74" y2="84"/><line x1="62" y1="72" x2="86" y2="72"/></g>${P("28,72 46,52 70,52 74,72")}${P("46,52 52,72")}<g class="a-bob-fast">${H(60, 22)}${P("60,29 48,50")}${P("58,34 70,50")}${P("48,50 58,62 52,72")}</g>`,
      swim: `<g class="flow">${[0, 1, 2].map(i => `<path class="wave" d="M${-40 + i * 0} ${66 + i * 9} q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>`).join("")}</g><g class="a-swim" style="transform-origin:64px 58px">${H(72, 56)}${P("22,62 66,58")}${P("62,58 70,38 86,44")}</g>`,
      box: `${gd}${H(42, 22)}${P("42,29 45,54")}${P("45,54 34,88")}${P("45,54 58,88")}${P("44,35 50,45 49,31")}<g class="a-punch">${P("44,35 62,36 74,34")}<circle class="glove" cx="78" cy="34" r="5"/></g>`,
      dance: `${gd}<g class="a-sway" style="transform-origin:50px 88px">${H(50, 20)}${P("50,27 50,52")}${P("50,32 34,18")}${P("50,32 66,42 72,32")}${P("50,52 40,70 44,88")}${P("50,52 62,68 66,86")}</g>`,
      yoga: `${gd}<g class="a-sway-slow" style="transform-origin:50px 88px">${H(50, 24)}${P("50,31 50,56")}${P("50,36 44,18 50,8")}${P("50,36 56,18 50,8")}${P("50,56 50,88")}${P("50,56 38,66 50,70")}</g>`,
      pullup: `<line class="bar" x1="14" y1="12" x2="86" y2="12"/><g class="a-pull">${P("38,12 44,32")}${P("62,12 56,32")}${H(50, 27)}${P("50,34 50,60")}${P("50,60 44,82")}${P("50,60 56,82")}</g>`,
      weights: `${gd}${H(50, 22)}${P("50,29 50,56")}${P("50,56 42,88")}${P("50,56 58,88")}<g class="a-lift">${P("50,34 36,32 34,16")}${P("50,34 64,32 66,16")}<rect class="db" x="25" y="11" width="18" height="7" rx="2"/><rect class="db" x="57" y="11" width="18" height="7" rx="2"/></g>`,
      stairs: `<polyline class="gd" points="4,92 26,92 26,78 46,78 46,64 66,64 66,50 96,50"/><g class="a-climb">${H(30, 46)}${P("30,53 30,68")}${P("30,57 38,63")}${P("30,68 36,78")}${P("30,68 24,79")}</g>`,
      generic: `<g class="a-lift"><rect class="db" x="20" y="38" width="12" height="26" rx="3"/><rect class="db" x="68" y="38" width="12" height="26" rx="3"/><line x1="32" y1="51" x2="68" y2="51"/></g>`
    };
    return `<svg class="exo" viewBox="0 0 100 100" aria-hidden="true">${F[kind] || F.generic}</svg>`;
  }

  // Couvertures de page générées (le coach peut aussi importer sa propre image)
  const COVER_STYLES = ["aurora", "lines", "grid", "dots", "stripes", "waves"];
  const COVER_PALETTES = [["#C6FF4D", "#1E5F3A", "#0B0D0A"], ["#FF6B3D", "#7A1E3A", "#120B10"], ["#4DD9FF", "#2B3A8F", "#0A0D18"], ["#FFD23D", "#B5481E", "#140E08"], ["#B98CFF", "#3A1E7A", "#0E0A18"], ["#3DFFB0", "#0E5A6B", "#081214"]];
  function coverSVG(cv, fallbackId) {
    const h0 = hashStr(fallbackId || "vaultr");
    const c = cv?.type === "gen" ? cv : { style: COVER_STYLES[h0 % COVER_STYLES.length], seed: h0 };
    const R = rng(c.seed), [a, b, bg] = COVER_PALETTES[c.seed % COVER_PALETTES.length], id = "cv" + Math.floor(R() * 1e9);
    let inner = "";
    if (c.style === "aurora") inner = `<defs><filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter></defs><g filter="url(#${id})">${[a, b, a, b].map((col, i) => `<circle class="cv-float" style="--i:${i}" cx="${40 + R() * 320}" cy="${20 + R() * 120}" r="${50 + R() * 50}" fill="${col}" opacity="${.45 + R() * .4}"/>`).join("")}</g>`;
    else if (c.style === "lines") inner = Array.from({ length: 14 }, (_, i) => { const y = 8 + i * 11, k = R() * 30; return `<path d="M-10 ${y} C 90 ${y - k} 170 ${y + k} 250 ${y} S 360 ${y - k} 420 ${y}" fill="none" stroke="${i % 3 ? b : a}" stroke-width="${i % 3 ? 1.2 : 2}" opacity="${i % 3 ? .7 : .9}"/>`; }).join("");
    else if (c.style === "grid") inner = `<rect y="70" width="400" height="90" fill="url(#${id})"/><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}" stop-opacity=".45"/><stop offset="1" stop-color="${bg}" stop-opacity="0"/></linearGradient></defs>${Array.from({ length: 15 }, (_, i) => `<line x1="200" y1="70" x2="${-200 + i * 57}" y2="170" stroke="${a}" stroke-opacity=".5"/>`).join("")}${Array.from({ length: 6 }, (_, i) => `<line x1="0" x2="400" y1="${74 + i * i * 3.2}" y2="${74 + i * i * 3.2}" stroke="${a}" stroke-opacity="${.25 + i * .08}"/>`).join("")}<circle cx="200" cy="66" r="${26 + R() * 10}" fill="${b}" opacity=".9"/>`;
    else if (c.style === "dots") inner = Array.from({ length: 18 * 8 }, (_, i) => { const x = (i % 18) * 23 + 6, y = Math.floor(i / 18) * 21 + 8, d = Math.hypot(x - 300 * R() - 50, y - 80) ; return `<circle cx="${x}" cy="${y}" r="${Math.max(.6, 7 - d / 30)}" fill="${i % 7 ? a : b}" opacity=".85"/>`; }).join("");
    else if (c.style === "stripes") inner = Array.from({ length: 12 }, (_, i) => `<rect x="${-120 + i * 52}" y="-40" width="${12 + (i % 3) * 10}" height="260" fill="${i % 2 ? a : b}" opacity="${.25 + (i % 4) * .15}" transform="rotate(28 200 80)"/>`).join("");
    else inner = Array.from({ length: 6 }, (_, i) => `<path d="M-10 ${60 + i * 18} C 80 ${30 + i * 18 + R() * 30} 180 ${90 + i * 18 - R() * 30} 260 ${60 + i * 18} S 380 ${40 + i * 18} 420 ${70 + i * 18} L 420 200 L -10 200 Z" fill="${i % 2 ? a : b}" opacity="${.12 + i * .1}"/>`).join("");
    return `<svg class="cover-svg" viewBox="0 0 400 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="400" height="160" fill="${bg}"/>${inner}</svg>`;
  }
  const coverHTML = c => c?.cover?.type === "img" ? `<img class="cover-img" src="${esc(c.cover.img)}" alt="">` : coverSVG(c?.cover, c?.id || c?.handle);

  // Carte animée des lieux de travail (dessinée : pas de service de carte externe)
  function mapHTML(c) {
    const phys = (c.places || []).filter(x => x.label && x.type !== "online");
    const remote = !!c.ai || !!c.remote || (c.places || []).some(x => x.type === "online");
    const R = rng(hashStr((c.city || "x") + (c.id || "")));
    let streets = "";
    for (let i = 0; i < 7; i++) { const y = 18 + i * 28 + R() * 10; streets += `<path class="st" d="M-10 ${y} C 120 ${y + (R() - .5) * 40}, 260 ${y + (R() - .5) * 40}, 410 ${y + (R() - .5) * 30}"/>`; }
    for (let i = 0; i < 6; i++) { const x = 30 + i * 70 + R() * 20; streets += `<path class="st" d="M${x} -10 C ${x + (R() - .5) * 40} 80, ${x + (R() - .5) * 40} 150, ${x + (R() - .5) * 30} 230"/>`; }
    const main = `<path class="st main" d="M-10 ${110 + R() * 30} C 140 ${50 + R() * 40}, 260 ${150 + R() * 30}, 410 ${70 + R() * 40}"/>`;
    const sea = `<path class="sea" d="M-10 178 C 80 162, 160 198, 250 182 S 380 172, 410 186 L 410 240 L -10 240 Z"/><path class="sea-line" d="M-10 186 C 80 170, 160 206, 250 190 S 380 180, 410 194"/>`;

  function makeLocalDb() {
    let data; try { data = JSON.parse(lsGet(DEMO_KEY)); } catch {} if (!data) data = demoSeed();
    const listeners = new Set();
    const isObj = v => v && typeof v === "object" && !Array.isArray(v);
    const deepMerge = (a, b) => { const o = { ...a }; for (const [k, v] of Object.entries(b)) o[k] = isObj(v) && isObj(o[k]) ? deepMerge(o[k], v) : v; return o; };
    const emit = () => { lsSet(DEMO_KEY, JSON.stringify(data)); setTimeout(() => listeners.forEach(fn => fn()), 0); };
    const clone = v => JSON.parse(JSON.stringify(v));
    const snap = path => ({ id: path.split("/").pop(), exists: path in data, data: () => (path in data ? clone(data[path]) : undefined), metadata: { fromCache: false, hasPendingWrites: false } });
    const parent = p => p.slice(0, p.lastIndexOf("/"));
    const test = (x, op, v) => op === "==" ? x === v : op === "!=" ? x !== v : op === "in" ? v.includes(x) : op === ">" ? x > v : op === "<" ? x < v : true;
    function query(col, filters = [], order = null, lim = null) {
      const run = () => {
        let docs = Object.keys(data).filter(p => parent(p) === col).map(snap).filter(s => filters.every(([f, op, v]) => test(s.data()[f], op, v)));
        if (order) { const [f, d] = order; docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x > y ? 1 : x < y ? -1 : 0) * (d === "desc" ? -1 : 1); }); }
        if (lim) docs = docs.slice(0, lim);
        return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
      };
      return {
        where: (f, op, v) => query(col, [...filters, [f, op, v]], order, lim),
        orderBy: (f, d = "asc") => query(col, filters, [f, d], lim),
        limit: n => query(col, filters, order, n),
        get: async () => run(),
        onSnapshot(next) { const fn = () => next(run()); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); }
      };
    }
    const docRef = path => ({
      id: path.split("/").pop(), path,
      get: async () => snap(path),
      set: async v => { data[path] = clone(v); emit(); },
      update: async v => { if (!(path in data)) throw { code: "invalid_argument", message: "absent" }; data[path] = deepMerge(data[path], clone(v)); emit(); },
      delete: async () => { delete data[path]; emit(); },
      onSnapshot(next) { const fn = () => next(snap(path)); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
      collection: sub => colRef(path + "/" + sub)
    });
    const colRef = col => Object.assign(query(col), { path: col, doc: id => docRef(col + "/" + (id || rid())), add: async v => { const r = docRef(col + "/" + rid()); await r.set(v); return r; } });
    return {
      doc: docRef,
      collection: colRef,
      reset() { data = demoSeed(); for (const k of Object.keys(localStorage || {})) if (k.startsWith("vaultr-seen-demo")) try { localStorage.removeItem(k); } catch {} emit(); }
    };
  }

      c.style.left = x0 - 11 + "px"; c.style.top = y0 - 11 + "px";

    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = sign + euro(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };

      if (!me.id) { A.mode = "blocked"; A.blockedWhy = "signin"; return render(); }
      const canWrite = await user.can("data.write");

  // Détecte l'argent reçu depuis la dernière visite (même appli fermée) et lance l'encaissement.
  let seenTs = null;
  function checkNewMoney() {
    if (A.gate || A.quizMode) return; // l'encaissement attend que le sportif soit entré dans l'appli
    const key = `vaultr-seen-${A.mode}-${A.myId}`;
    const newest = A.events.reduce((m, e) => Math.max(m, e.ts || 0), 0);
    if (seenTs === null) {
      const stored = lsGet(key);
      seenTs = stored !== null ? +stored : newest; // premier passage sur cet appareil : on ne fête pas l'historique
      if (stored === null) lsSet(key, String(seenTs));
    }
    const fresh = A.events.filter(e => e.amount > 0 && e.ts > seenTs).sort((a, b) => a.ts - b.ts);
    if (!fresh.length) return;
    seenTs = Math.max(seenTs, newest); lsSet(key, String(seenTs));
    const coach = coachById(fresh[0].coachId);
    const who = first(coach?.name) || "Ton coach";
    celebrate(fresh.reduce((a, e) => a + e.amount, 0), fresh.map(e => `${who} a validé : ${e.label.replace(/ validé.*$/, "")} · +${euro(e.amount)}`));
  }

  const quizGoalKey = prof => GOAL_KEY[prof?.quiz?.goal] || LABEL_KEY[prof?.goal] || "forme";
  function sessionsPerMonth(q) { return { "1 à 2": 6, "3": 12, "4": 16, "5 ou plus": 20 }[q?.perWeek] || 10; }
  // Choisit les exercices qui respectent les réponses : jamais un interdit, une douleur ou un matériel manquant
  function pickExercises(prof) {

    const dis = q.dislikes || [], pains = q.pains || [], eqs = q.equipment || [], pls = q.places?.length ? q.places.map(x => x === "À la maison" ? "Maison" : x) : null, likes = q.likes || [];
    const lvl = /Débutant/.test(q.level || "") ? 0 : /Confirmé/.test(q.level || "") ? 3 : /Régulier/.test(q.level || "") ? 2 : 1;
    const banned = (q.banned || []).map(b => b.toLowerCase());
    const ok = e => !banned.some(b => e.n.toLowerCase().startsWith(b)) && !(e.dis || []).some(x => dis.includes(x)) && !(e.pain || []).some(x => pains.includes(x))
      && (!e.eq || e.eq.some(x => eqs.includes(x))) && (!e.pl || !pls || e.pl.some(x => pls.includes(x)));
    const scored = LIB.filter(ok).map(e => ({ e, sc: (e.g.includes(goal) ? 4 : 0) + 3 * (e.like || []).filter(x => likes.includes(x)).length + (e.diff === 3 ? (lvl === 0 ? -3 : lvl >= 2 ? 1 : 0) : 0) + (e.diff === 1 && lvl >= 3 ? -1 : 0) }))
      .sort((a, b) => b.sc - a.sc || a.e.n.localeCompare(b.e.n));
    const n = sessionsPerMonth(q) >= 12 ? 4 : 3;
    let picks = scored.slice(0, n).map(x => x.e);

    const p = s.data(), tasks = p.tasks.map(t => ({ ...t })), t = tasks.find(x => x.id === taskId);
    if (!t || t.done >= t.target) return null;
    t.earned = Math.round((earned(t) + t.value) * 100) / 100; t.done++;
    await progRef(aid).update({ tasks });
    await A.db.collection("events").add({ athleteId: aid, coachId: by, label: `${t.name} validé${viaProof ? " (preuve)" : ""}`, amount: t.value, ts: now() });
    return t;
  }
  async function reviewProof(pr, ok) {
    if (ok) await validateTask(pr.athleteId, pr.taskId, true);
    await A.db.doc("proofs/" + pr.id).update({ status: ok ? "ok" : "ko", reviewedAt: now(), ...(pr.kind === "video" ? { chunks: 0, poster: "" } : {}) });
    await dropVideo(pr); // la vidéo est supprimée après la décision pour garder de la place
  }

  // Arrondit au centime et met le reste éventuel sur le point faible (ou le premier exercice)
  // L'argent déjà rendu est acquis : on ne répartit que ce qui reste de la mise sur les séances restantes.
  const planned = tasks => tasks.reduce((a, t) => a + earned(t) + t.value * left(t), 0);
  function fitBudget(tasks, vals, budget) {
    vals = vals.map(v => Math.max(0, Math.round(v * 100) / 100));
    const open = tasks.map((t, i) => i).filter(i => left(tasks[i]) > 0);
    if (!open.length) return vals;
    const k = open.find(i => tasks[i].weak) ?? open[0];
    const gap = budget - tasks.reduce((a, t, i) => a + earned(t) + vals[i] * left(t), 0);
    vals[k] = Math.max(0, Math.round((vals[k] + gap / left(tasks[k])) * 100) / 100);
    return vals;
  }
  const budgetOk = (tasks, budget) => Math.abs(planned(tasks) - budget) <= .1;
  function aiSplit(tasks, budget) {
    const rest = Math.max(0, budget - recovered({ tasks }));
    const w = tasks.map(t => t.diff * (t.weak ? 1.6 : 1));
    const denom = tasks.reduce((a, t, i) => a + w[i] * left(t), 0) || 1;
    return fitBudget(tasks, tasks.map((t, i) => left(t) ? rest * w[i] / denom : t.value), budget);
  }

    }).join("");
    return `<svg viewBox="0 0 240 240" aria-hidden="true">
      <g class="ticks door" id="door" style="transform:rotate(${pct * 180}deg)">${ticks}</g>

      <circle cx="120" cy="120" r="96" class="ring" id="ring" transform="rotate(-90 120 120)" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - pct)}"/></g>
    </svg>`;

  // Démos photo/vidéo fournies par le coach : profiles/<coach>/media/<id> (vidéo en morceaux dans chunks)
  const mediaCache = {};
  function coachMedia(cid, mid) {
    const k = cid + "/" + mid;
    if (!mediaCache[k]) { mediaCache[k] = { loading: true }; A.db.doc(`profiles/${cid}/media/${mid}`).get().then(sn => { mediaCache[k] = sn.exists ? sn.data() : { missing: true }; schedule(); }).catch(() => { mediaCache[k] = { missing: true }; }); }
    return mediaCache[k];
  }
  function taskThumb(t, coachId) {
    if (t.media?.id && coachId && coachId !== AI_ID) {
      const m = coachMedia(coachId, t.media.id);
      if (m.kind === "photo") return `<img src="${esc(m.img)}" alt="">`;
      if (m.kind === "video") return `${m.poster ? `<img src="${esc(m.poster)}" alt="">` : ""}<span class="play">▶</span>`;
    }
    return exoSVG(exoKind(t.name));
  }
  function taskAthlete(t) {
    const pend = A.proofsAth.find(x => x.taskId === t.id && x.status === "pending");
    const last = A.proofsAth.filter(x => x.taskId === t.id).sort((a, b) => b.ts - a.ts)[0];
    const refused = !pend && last?.status === "ko";
    const aiNote = !pend && last?.aiMessage && now() - (last.reviewedAt || last.ts) < 3 * 86400000 ? last.aiMessage : "";
    const full = t.done >= t.target, ai = A.program?.coachId === AI_ID;
    return `<div class="task t2 ${t.weak ? "weak" : ""} ${full ? "full" : ""}">
      <button type="button" class="exo-thumb" data-howto="${esc(t.id)}" aria-label="Voir comment faire ${esc(t.name)}">${taskThumb(t, A.program?.coachId)}</button>

      <span class="val-chip" title="Valeur de chaque validation">${euro(t.value)}</span>

           <label class="btn small primary"><input type="file" accept="image/*,video/*" data-proof="${esc(t.id)}" hidden>📸 J'ai fait l'exercice</label>
           <button type="button" class="btn small ghost" data-howto="${esc(t.id)}">Comment faire ?</button>`}
      </div>
      ${aiNote ? `<div class="ai-note ${refused ? "ko" : ""}"><b>🤖 Vaultr :</b> ${esc(aiNote)}</div>` : ""}

  // Feuille « Comment faire » : grande illustration, ou démo du coach
  async function loadCoachVideo(cid, mid, m) {
    const snaps = await Promise.all(Array.from({ length: m.chunks }, (_, i) => A.db.doc(`profiles/${cid}/media/${mid}/chunks/${String(i).padStart(3, "0")}`).get()));
    if (snaps.some(x => !x.exists)) throw { ui: "La vidéo n'est plus disponible." };
    const b64 = snaps.map(x => x.data().d).join(""), mime = m.mime || "video/webm", bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { url: URL.createObjectURL(new Blob([bytes], { type: mime })), fallback: `data:${mime};base64,${b64}` };
  }
  function sheetHowTo(taskId) {
    const p = A.program, t = (p?.tasks || []).find(x => x.id === taskId); if (!t) return;
    const coach = myCoach(), cid = p.coachId, m = t.media?.id && cid !== AI_ID ? coachMedia(cid, t.media.id) : null;
    const full = t.done >= t.target, pend = A.proofsAth.some(x => x.taskId === t.id && x.status === "pending");
    const visual = m?.kind === "photo" ? `<img class="howto-media" src="${esc(m.img)}" alt="Démonstration de ${esc(t.name)}">`
      : m?.kind === "video" ? `<div class="howto-media vid" id="howVid">${m.poster ? `<img src="${esc(m.poster)}" alt="">` : ""}<span class="play big">▶</span></div>`
      : `<div class="howto-media exo-big">${exoSVG(exoKind(t.name))}</div>`;
    openSheet(`<div class="grab"></div>${visual}
      <span class="muted" style="font-size:12px">${m ? `Démo de ${esc(first(coach?.name) || "ton coach")}` : "Illustration Vaultr"}</span>
      <h2>${esc(t.name)}</h2>${t.detail ? `<p class="muted" style="margin:0">${esc(t.detail)}</p>` : ""}
      <div class="howto-steps">
        <div><b>${t.target - t.done}</b><span>fois encore ce mois-ci</span></div>
        <div><b>${t.done}/${t.target}</b><span>déjà validé${t.done > 1 ? "s" : ""}</span></div>
      </div>
      <p class="note" style="margin:0">Pour valider : filme ta série (30 s max) ou prends une photo pendant l'exercice. ${cid === AI_ID ? "Vaultr vérifie en quelques secondes." : `${esc(first(coach?.name) || "Ton coach")} valide dès qu'il la voit.`}</p>
      ${full || pend ? "" : `<label class="btn primary wide"><input type="file" accept="image/*,video/*" data-proof="${esc(t.id)}" hidden>📸 J'ai fait l'exercice</label>`}`, sh => {
      sh.addEventListener("change", e => { if (e.target.closest("input[data-proof]")) { onProofChange(e); closeSheet(); } });
      const v = sh.querySelector("#howVid");
      if (v) v.addEventListener("click", () => {
        v.innerHTML = `<span class="play big">…</span>`;

          const el = document.createElement("video"); el.className = "howto-media"; el.controls = true; el.playsInline = true; el.autoplay = true; el.muted = true; el.loop = true;
          el.onerror = () => { if (el.src !== fallback) el.src = fallback; }; el.src = url; v.replaceWith(el);
        }).catch(x => { toast(x?.ui || "Impossible de lire la vidéo."); v.innerHTML = `<span class="play big">▶</span>`; });
      });
    });
  }

    const v = await openVideo(file);

    const poster = await grabPoster(v);
    let blob = file, mime = file.type || "video/mp4";
    if (file.size > DIRECT_BYTES) { const o = await compressVideo(v, () => {}); blob = o.blob; mime = o.mime; }
    if (blob.size > MAX_BYTES) throw { ui: "Vidéo trop lourde, même compressée. Filme une démo plus courte." };
    const b64 = await blobToB64(blob), parts = [];
    for (let i = 0; i < b64.length; i += CHUNK) parts.push(b64.slice(i, i + CHUNK));
