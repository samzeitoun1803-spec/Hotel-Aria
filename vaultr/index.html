      const rerender = () => { const st = sh.scrollTop; sh.innerHTML = body(); wire(sh); sh.scrollTop = st; };
      sh.querySelectorAll("[data-val]").forEach(inp => inp.addEventListener("change", () => { draft[+inp.dataset.val].value = Math.max(0, +inp.value || 0); rerender(); }));
      sh.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { draft.splice(+b.dataset.del, 1); rerender(); }));
      sh.querySelector("#aiBtn")?.addEventListener("click", () => { aiSplit(draft, budget).forEach((v, i) => draft[i].value = v); rerender(); toast("Mise répartie selon la difficulté et les points faibles"); });
      sh.querySelector("#addTask").addEventListener("click", () => {
        const name = sh.querySelector("#ntName").value.trim(); if (!name) { sh.querySelector("#ntName").focus(); return; }
        draft.push({ id: rid(), name: name.slice(0, 40), detail: "", value: 0, target: Math.min(31, Math.max(1, +sh.querySelector("#ntTarget").value || 8)), done: 0, earned: 0, diff: +sh.querySelector("#ntDiff").value, weak: sh.querySelector("#ntWeak").checked });
        if (budget) aiSplit(draft, budget).forEach((v, i) => draft[i].value = v);
        rerender();
      });
      sh.querySelector("#progOk").addEventListener("click", () => { closeSheet(); guard(() => progRef(aid).update({ tasks: draft }), "Programme enregistré. Ton client le voit déjà."); });
    });
  }

  /* ---------- Coach : preuves ---------- */
  function viewProofs() {
    const pend = A.proofsCoach.filter(p => p.status === "pending");
    const done = A.proofsCoach.filter(p => p.status !== "pending").slice(0, 6);
    return `<section class="screen ENTER">
      <div class="eyebrow">À distance</div><h2>Preuves à vérifier</h2>
      ${pend.length ? pend.map(p => `<div class="card">
          <div class="split"><div><h3>${esc(first(athleteName(p.athleteId)))} · ${esc(p.taskName)}</h3><div class="muted" style="font-size:12px">Envoyée le ${new Date(p.ts).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</div></div><div class="price">${euro(p.value)}</div></div>
          ${p.kind === "video" ? `<div class="vid-wrap" id="vid-${esc(p.id)}">
              ${p.poster ? `<img class="proof-img" src="${esc(p.poster)}" alt="Aperçu de la vidéo pour ${esc(p.taskName)}">` : `<div class="proof-img"></div>`}
              <button type="button" class="vid-play" data-play="${esc(p.id)}" aria-label="Lire la vidéo"><span>▶</span>Vidéo · ${Math.round(p.duration || 0)} s</button>
            </div>`
          : p.img ? `<img class="proof-img" src="${esc(p.img)}" alt="Preuve envoyée pour ${esc(p.taskName)}">` : `<div class="proof-img">Pas d'image</div>`}
          <div class="row"><button type="button" class="btn small primary" data-approve="${esc(p.id)}" style="flex:1">✓ Valider · rendre ${euro(p.value)}</button><button type="button" class="btn small" data-reject="${esc(p.id)}">Refuser</button></div>
        </div>`).join("")
      : `<div class="card"><h3>Rien à vérifier</h3><p class="muted" style="margin:0">Quand un client t'envoie une photo ou une vidéo d'un exercice, elle apparaît ici en direct.</p></div>`}
      ${done.length ? `<h2>Déjà traitées</h2><div class="list">${done.map(p => `<div class="split" style="padding:4px 2px"><span>${esc(first(athleteName(p.athleteId)))} · ${esc(p.taskName)}</span><span class="chip ${p.status === "ok" ? "volt" : "loss"}">${p.status === "ok" ? "Validée" : "Refusée"}</span></div>`).join("")}</div>` : ""}
    </section>`;
  }

  /* ---------- Coach : visibilité / Pro ---------- */
  function viewPro() {
    const me = A.profile, boosted = (me.boostedUntil || 0) > now();
    const daysB = boosted ? Math.ceil((me.boostedUntil - now()) / 86400000) : 0;
    return `<section class="screen ENTER">
      <div class="eyebrow">Mon profil coach</div>
      <div class="card"><div class="row"><div class="avatar volt">${esc(initials(me.name))}</div><div class="grow"><h3>${esc(me.name)}</h3><div class="muted" style="font-size:13px">${esc(me.sport || "")}${me.city ? " · " + esc(me.city) : ""} · ${euro(me.price || 0)}/mois</div></div>${me.pro ? `<span class="chip volt">PRO</span>` : ""}</div>
        ${copyTag()}</div>
      <div class="card">
        <div class="split"><h3>⚡ Booster ma visibilité</h3><b class="num">9,90 €</b></div>
        <p class="muted" style="margin:0;font-size:14px">Apparais en tête de « Trouver un coach » pendant 30 jours, avec le badge « Mis en avant ». Paiement unique, sans abonnement.</p>
        <button type="button" class="btn ${boosted ? "" : "primary"} wide" data-act="boost" ${boosted ? "disabled" : ""}>${boosted ? `Boost actif · encore ${daysB} jour${daysB > 1 ? "s" : ""}` : "Booster pour 30 jours (simulé)"}</button>
      </div>
      <div class="card">
        <div class="split"><h3>Vaultr Pro</h3><b class="num">14,90 € / mois</b></div>
        <ul class="muted" style="margin:0;padding-left:18px;font-size:14px">
          <li>Programmes complets générés par l'IA</li><li>Bibliothèque de programmes réutilisables</li><li>Statistiques de régularité de tes clients</li><li>Badge PRO dans la recherche</li></ul>
        <button type="button" class="btn ${me.pro ? "" : "primary"} wide" data-act="pro">${me.pro ? "Arrêter Pro (simulé)" : "Passer Pro (simulé)"}</button>
      </div>
      <p class="note">Côté sportif, Vaultr reste sans abonnement.</p>
    </section>`;
  }

  /* ---------- Réglages ---------- */
  function sheetSettings() {
    const me = A.profile;
    openSheet(`<div class="grab"></div><h2>Mon compte</h2>
      <div class="card"><div class="row"><div class="avatar volt">${esc(initials(me.name))}</div><div class="grow"><h3>${esc(me.name)}</h3><div class="muted" style="font-size:13px">@${esc(me.handle)} · ${me.role === "coach" ? "Coach" : "Sportif"}</div></div></div></div>
      ${A.mode === "live" ? `
        <button type="button" class="btn wide" data-s="switch">Passer en profil ${me.role === "coach" ? "sportif" : "coach"}</button>
        <button type="button" class="btn wide ghost" data-s="demo">Essayer la démo (Léa et Karim)</button>`
      : `<p class="note">Tu es dans la <b>démo</b> : les données restent sur cet appareil.</p>
        ${A.liveDb ? `<button type="button" class="btn primary wide" data-s="live">Utiliser mon vrai compte</button>` : ""}
        <button type="button" class="btn wide ghost" data-s="reset">Remettre la démo à zéro</button>`}
      <p class="muted" style="margin:0;font-size:12px">Paiements simulés : aucune vraie somme n'est débitée.</p>`, sh => {
      sh.addEventListener("click", e => {
        const b = e.target.closest("[data-s]"); if (!b) return;
        const s = b.dataset.s; closeSheet();
        if (s === "demo") { startDemo(); toast("Mode démo : tu peux passer de Léa à Karim en haut"); }
        if (s === "live") { startLive(); }
        if (s === "reset") { A.demoDb.reset(); resetData(); subscribeBase(); toast("Démo remise à zéro"); }
        if (s === "switch") guard(async () => {
          const role = me.role === "coach" ? "athlete" : "coach";
          await A.db.doc("profiles/" + A.myId).update(role === "coach" ? { role, sport: me.sport || SPORTS[0], price: me.price ?? 150, boostedUntil: me.boostedUntil || 0, pro: !!me.pro } : { role, goal: me.goal || "Remise en forme" });
        }, "Profil changé");
      });
    });
  }

  /* ---------- Feuilles ---------- */
  function openSheet(html, wire) {
    closeSheet();
    const w = document.createElement("div"); w.className = "sheet-wrap"; w.id = "sheetWrap";
    w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    w.addEventListener("click", e => { if (e.target === w) closeSheet(); });
    $phone.appendChild(w); wire && wire(w.querySelector(".sheet"));
  }
  function closeSheet() { document.getElementById("sheetWrap")?.remove(); }
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); closeCele(); } });

  /* =====================================================================
     Après rendu : animation du coffre, recherche
     ===================================================================== */
  let lastMsgCount = -1, lastChatKey = "";
  function afterRender() {
    const box = document.getElementById("msgs");
    if (box) {
      const key = chatSub?.id || "";
      if (key !== lastChatKey || A.msgs.length !== lastMsgCount) $main.scrollTop = $main.scrollHeight; // descend sur le dernier message
      lastChatKey = key; lastMsgCount = A.msgs.length;
      markRead();
      const form = document.getElementById("composer");
      if (form && !form.dataset.wired) {
        form.dataset.wired = "1";
        form.addEventListener("submit", e => {
          e.preventDefault();
          const inp = document.getElementById("chatInput"), text = inp.value.trim();
          if (!text) return;
          inp.value = ""; inp.focus();
          sendMessage(text.slice(0, 1000)).catch(() => { toast("Message non envoyé. Vérifie ta connexion."); const i = document.getElementById("chatInput"); if (i && !i.value) i.value = text; });
        });
      }
    } else { lastChatKey = ""; lastMsgCount = -1; }
    const el = document.getElementById("recAmount");
    if (el && A.program?.mise) {
      const now_ = recovered(A.program);
      if (lastVault === null) lastVault = 0; // le coffre se remplit à l'ouverture
      if (now_ !== lastVault) {
        const from = lastVault, pct = Math.min(1, now_ / A.program.mise), C = 2 * Math.PI * 96;
        lastVault = now_;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const ring = document.getElementById("ring"); if (ring) ring.style.strokeDashoffset = C * (1 - pct);
          const door = document.getElementById("door"); if (door) door.style.transform = `rotate(${pct * 180}deg)`;
          countUp(el, from, now_); el.classList.add("pop");
        }));
      }
    }
    const s = document.getElementById("coachSearch");
    if (s && !s.dataset.wired) { s.dataset.wired = "1"; s.addEventListener("input", () => { A.coachQuery = s.value; document.getElementById("coachList").innerHTML = coachListHTML(); }); }
    const f = document.getElementById("onboardForm");
    if (f && !f.dataset.wired) {
      f.dataset.wired = "1";
      f.addEventListener("submit", async e => {
        e.preventDefault();
        const g = id => document.getElementById(id)?.value || "";
        const err = document.getElementById("obErr"); err.textContent = "";
        const btn = f.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Création…";
        try { await createProfile({ role: A.onboardRole, name: g("obName"), handle: g("obHandle"), city: g("obCity"), sport: g("obSport"), price: g("obPrice"), goal: g("obGoal") }); toast("Compte créé. Bienvenue sur Vaultr !"); }
        catch (x) { const e2 = document.getElementById("obErr"); if (e2) e2.textContent = x?.ui || "Impossible de créer le compte. Réessaie."; const b = document.querySelector("#onboardForm button[type=submit]"); if (b) { b.disabled = false; b.textContent = "Créer mon compte"; } }
      });
    }
  }

  /* =====================================================================
     Événements
     ===================================================================== */
  $switch.addEventListener("click", e => {
    const b = e.target.closest("button[data-role]"); if (!b || A.mode !== "demo") return;
    const id = b.dataset.role === "athlete" ? "demo_lea" : "demo_karim";
    if (id === A.myId) return;
    A.demoAs = id; lsSet("vaultr-demo-as", id); A.myId = id; resetData(); subscribeBase(); render();
  });
  $settings.addEventListener("click", sheetSettings);
  $tabbar.addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    A.tab[A.profile.role] = b.dataset.tab; A.openClient = null;
    if (A.profile.role === "coach" && A.chatWith) { A.chatWith = null; closeChatSub(); }
    render(); if (b.dataset.tab !== "chat") $main.scrollTop = 0;
  });

  $main.addEventListener("click", e => {
    const t = e.target.closest("button, [data-client]"); if (!t || t.disabled) return;
    const d = t.dataset;
    if (d.pick) { A.onboardRole = d.pick; render(); return; }
    if (d.act === "onboard-back") { A.onboardRole = null; render(); return; }
    if (d.act === "demo-on") { startDemo(); return; }
    if (d.goto) { A.tab.athlete = d.goto; render(); return; }
    if (d.chat) { A.tab.coach = "chat"; A.chatWith = d.chat; A.openClient = null; openChatSub(chatId(d.chat, A.myId)); render(); return; }
    if ("chatBack" in d) { A.chatWith = null; closeChatSub(); render(); return; }
    if (d.sport) { A.coachFilter = d.sport; render(); return; }
    if (d.add) { const c = A.coaches.find(x => x.id === d.add); if (c) guard(() => addCoach(c), `${first(c.name)} est maintenant ton coach`); return; }
    if (d.open === "mise") return sheetMise();
    if (d.open === "program") return sheetProgram(A.openClient);
    if (d.client) { A.openClient = d.client; render(); $main.scrollTop = 0; return; }
    if ("back" in d) { A.openClient = null; render(); return; }
    if (d.validate) return guard(async () => { const task = await validateTask(A.openClient, d.validate, false); if (task) { coinBurst(t, task.value); toast(`+${euro(task.value)} rendus à ${first(athleteName(A.openClient))} 💸`); } });
    if (d.approve) { const p = A.proofsCoach.find(x => x.id === d.approve); if (p) guard(async () => { await reviewProof(p, true); coinBurst(t, p.value); }, `+${euro(p?.value)} rendus 💸`); return; }
    if (d.play) {
      const p = A.proofsCoach.find(x => x.id === d.play); if (!p) return;
      t.disabled = true; t.innerHTML = "<span>…</span>Chargement";
      loadVideo(p).then(({ url, fallback }) => {
        const box = document.getElementById("vid-" + p.id); if (!box) return;
        const v = document.createElement("video");
        v.className = "proof-img"; v.controls = true; v.playsInline = true; v.autoplay = true; v.muted = true;
        v.onerror = () => { if (v.src !== fallback) v.src = fallback; else toast("Ce format de vidéo ne se lit pas sur cet appareil."); };
        v.src = url; box.replaceChildren(v);
      }).catch(x => { toast(x?.ui || "Impossible de lire cette vidéo."); t.disabled = false; t.innerHTML = "<span>▶</span>Réessayer"; });
      return;
    }
    if (d.reject) { const p = A.proofsCoach.find(x => x.id === d.reject); if (p) guard(() => reviewProof(p, false), "Preuve refusée. Ton client peut en renvoyer une."); return; }
    if (d.act === "boost") return guard(() => A.db.doc("profiles/" + A.myId).update({ boostedUntil: now() + 30 * 86400000 }), "Boost activé : tu es en tête de la recherche ⚡");
    if (d.act === "pro") return guard(() => A.db.doc("profiles/" + A.myId).update({ pro: !A.profile.pro }), A.profile.pro ? "Retour à la version gratuite" : "Vaultr Pro activé");
    if (d.act === "reuse") return toast(`${euro(recovered(A.program))} seront déduits de ton prochain mois (simulé)`);
    if (d.act === "withdraw") return toast(`Retrait de ${euro(recovered(A.program))} demandé (simulé)`);
    if (d.act === "copy-tag") {
      const txt = "@" + A.profile.handle;
      Promise.resolve().then(() => navigator.clipboard.writeText(txt)).then(() => toast("Tag copié")).catch(() => {
        const c = document.getElementById("myTag"); const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Tag sélectionné, copie-le");
      });
    }
  });

  // Envoi d'une preuve : photo réduite, ou vidéo compressée sur le téléphone puis envoyée en morceaux
  $main.addEventListener("change", e => {
    const inp = e.target.closest("input[data-proof]"); if (!inp || !inp.files[0]) return;
    const f = inp.files[0], taskId = inp.dataset.proof;
    inp.value = "";
    if (f.type.startsWith("video/") || /\.(mov|mp4|webm|m4v|3gp)$/i.test(f.name)) return sendVideoProof(f, taskId);
    if (!f.type.startsWith("image/")) { toast("Envoie une photo ou une vidéo."); return; }
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        let side = 720, q = .7, url;
        do {
          const c = document.createElement("canvas"), k = Math.min(1, side / Math.max(im.width, im.height));
          c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          url = c.toDataURL("image/jpeg", q); side *= .8; q -= .1;
        } while (url.length > 180000 && q > .2);
        guard(() => sendProof(taskId, { img: url }), "Preuve envoyée à ton coach 📸");
      };
      im.onerror = () => toast("Cette image n'a pas pu être lue.");
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });

  /* ---------- Vidéos ---------- */
  const MAX_SECONDS = 30, DIRECT_BYTES = 1200000, MAX_BYTES = 4000000;
  const blobToB64 = b => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = ko; r.readAsDataURL(b); });
  function progressSheet(title) {
    openSheet(`<div class="grab"></div><h2>${esc(title)}</h2><p class="muted" id="vpText" style="margin:0">Préparation…</p>
      <div class="bar" style="height:10px"><i id="vpBar" style="width:0%"></i></div>
      <p class="muted" style="margin:0;font-size:12px">Garde l'appli ouverte pendant l'envoi.</p>`);
    const wrap = document.getElementById("sheetWrap"); wrap.replaceWith(wrap.cloneNode(true)); // pas de fermeture par clic pendant l'envoi
    return (text, pct) => { const t = document.getElementById("vpText"), b = document.getElementById("vpBar"); if (t) t.textContent = text; if (b) b.style.width = Math.round(pct * 100) + "%"; };
  }
  function openVideo(file) {
    return new Promise((ok, ko) => {
      const v = document.createElement("video");
      v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = URL.createObjectURL(file);
      v.onloadedmetadata = () => {
        if (Number.isFinite(v.duration)) return ok(v);
        // certaines vidéos (souvent Android) n'annoncent pas leur durée : on va à la fin pour la connaître
        v.ondurationchange = () => { if (Number.isFinite(v.duration)) { v.ondurationchange = null; v.onseeked = () => { v.onseeked = null; ok(v); }; v.currentTime = 0; } };
        v.currentTime = 1e7;
        setTimeout(() => ko({ ui: "Impossible de lire la durée de cette vidéo." }), 8000);
      };
      v.onerror = () => ko({ ui: "Cette vidéo ne peut pas être lue sur ce téléphone. Essaie de la filmer à nouveau." });
    });
  }
  function grabPoster(v) {
    return new Promise(ok => {
      const draw = () => { try { const c = document.createElement("canvas"), k = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight)); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k); c.getContext("2d").drawImage(v, 0, 0, c.width, c.height); ok(c.toDataURL("image/jpeg", .6)); } catch { ok(""); } };
      v.onseeked = draw; try { v.currentTime = Math.min(.5, v.duration / 2 || 0); } catch { draw(); }
      setTimeout(() => ok(""), 4000);
    });
  }
  // Ré-encode la vidéo en petit format (480 px, sans le son) en la rejouant dans un canvas.
  function compressVideo(v, onProgress) {
    return new Promise((ok, ko) => {
      const type = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm", "video/mp4"].find(t => window.MediaRecorder?.isTypeSupported?.(t));
      if (!type || !HTMLCanvasElement.prototype.captureStream) return ko({ ui: "Ton navigateur ne peut pas compresser cette vidéo. Filme une vidéo plus courte (quelques secondes)." });
      const k = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
      const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * k / 2) * 2; c.height = Math.round(v.videoHeight * k / 2) * 2;
      const ctx = c.getContext("2d");
      const rec = new MediaRecorder(c.captureStream(24), { mimeType: type, videoBitsPerSecond: 600000 });
      const parts = []; rec.ondataavailable = e => e.data.size && parts.push(e.data);
      rec.onstop = () => ok({ blob: new Blob(parts, { type: type.split(";")[0] }), mime: type.split(";")[0] });
      let stopped = false;
      const stop = () => { if (!stopped) { stopped = true; rec.stop(); v.pause(); } };
      const frame = () => { if (stopped) return; ctx.drawImage(v, 0, 0, c.width, c.height); onProgress(Math.min(1, v.currentTime / v.duration)); if (v.ended) stop(); else requestAnimationFrame(frame); };
      v.onended = stop;
      v.currentTime = 0; rec.start(250);
      v.play().then(() => requestAnimationFrame(frame)).catch(() => { stopped = true; try { rec.stop(); } catch {} ko({ ui: "Impossible de lire la vidéo pour la compresser." }); });
      setTimeout(stop, (MAX_SECONDS + 5) * 1000);
    });
  }
  async function sendVideoProof(file, taskId) {
    if (A.busy) return;
    A.busy = true;
    let set = null;
    try {
      const v = await openVideo(file);
      if (v.duration > MAX_SECONDS + .5) throw { ui: `Vidéo trop longue : ${MAX_SECONDS} secondes maximum. Coupe-la ou filme seulement l'exercice.` };
      set = progressSheet("Envoi de ta vidéo");
      const poster = await grabPoster(v);
      let blob = file, mime = file.type || "video/mp4";
      if (file.size > DIRECT_BYTES) {
        const out = await compressVideo(v, p => set("Compression de la vidéo…", p * .6));
        blob = out.blob; mime = out.mime;
      }
      if (blob.size > MAX_BYTES) throw { ui: "Vidéo trop lourde, même compressée. Filme une vidéo plus courte." };
      set("Envoi à ton coach…", .6);
      const b64 = await blobToB64(blob);
      await sendProof(taskId, { video: b64, mime, poster, duration: v.duration }, p => set("Envoi à ton coach…", .6 + p * .4));
      URL.revokeObjectURL(v.src);
      closeSheet(); toast("Vidéo envoyée à ton coach 🎥");
    } catch (x) {
      closeSheet();
      toast(x?.ui || (x?.code === "quota_exceeded" ? "L'espace de stockage de Vaultr est plein." : "L'envoi de la vidéo a échoué. Vérifie ta connexion et réessaie."));
    } finally { A.busy = false; }
  }

  /* =====================================================================
     Lancement
     ===================================================================== */
  const splash = document.getElementById("splash");
  setTimeout(() => splash.classList.add("open"), reduced() ? 300 : 1700);
  setTimeout(() => splash.remove(), 3000);
  boot();
})();
</script>
</body>
