<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaultr</title>
<meta name="theme-color" content="#0B0D0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: une seule colonne "téléphone" (plein écran sur mobile, cadre centré sur ordinateur),
   écran d'accueil blanc qui s'ouvre comme une porte de coffre sur l'appli noir + vert clair. */
:root{
  --ink:#0B0D0A;        /* fond de l'appli, noir teinté vert */
  --panel:#141812;      /* surfaces */
  --panel-2:#1C2219;    /* surfaces surélevées */
  --line:#2A3326;       /* filets */
  --fg:#F1F6EC;         /* texte */
  --muted:#93A08C;      /* texte secondaire */
  --volt:#C6FF4D;       /* vert clair : argent récupéré, actions */
  --volt-dim:#C6FF4D22;
  --loss:#FF5C4D;       /* rouge, réservé à l'argent non récupéré */
  --paper:#FFFFFF;      /* écran d'accueil */
  --stage:#060705;      /* fond autour du téléphone */
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px;border-radius:6px}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-block:24px;padding-inline:16px}
.phone{position:relative;width:100%;max-width:400px;height:min(840px,calc(100vh - 48px));background:var(--ink);border-radius:36px;overflow:hidden;box-shadow:0 0 0 1px #1d231a,0 30px 80px #000c;display:flex;flex-direction:column}
.side{max-width:300px;color:var(--muted);font-size:14px}
.side h1{font-family:var(--display);font-stretch:118%;font-weight:900;font-style:italic;color:var(--fg);font-size:44px;line-height:.95;margin:0 0 12px;letter-spacing:-.01em}
.side h1 span{color:var(--volt)}
.side p{margin:0 0 12px}
.side .demo-tip{border-left:2px solid var(--volt);padding-left:12px;color:var(--fg)}
@media (max-width:860px){.side{display:none}}
@media (max-width:480px){
  .stage{padding:0;display:block;height:100%}
  .phone{max-width:none;height:100%;border-radius:0;box-shadow:none}
}

/* ---------- Écran d'accueil blanc / porte de coffre ---------- */
.splash{position:absolute;inset:0;z-index:50;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:clip-path .9s cubic-bezier(.7,0,.2,1)}
.splash.open{clip-path:circle(0% at 50% 44%);pointer-events:none}
.dial{width:150px;height:150px;position:relative}
.dial svg{width:100%;height:100%;animation:spin 1.6s cubic-bezier(.6,0,.2,1) both}
.wordmark{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:125%;font-size:46px;letter-spacing:-.02em;line-height:1}
.wordmark i{font-style:italic;color:#7DB800}
.splash small{font-size:13px;color:#555;letter-spacing:.14em;text-transform:uppercase}
@keyframes spin{from{transform:rotate(-200deg)}to{transform:rotate(0)}}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 8px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.brand{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:125%;font-size:24px;letter-spacing:-.02em}
.brand span{color:var(--volt)}
.role-switch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;font-size:12px;font-weight:600}
.role-switch button{padding:6px 11px;border-radius:999px;color:var(--muted)}
.role-switch button[aria-pressed="true"]{background:var(--volt);color:var(--ink)}

main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 24px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.screen{display:flex;flex-direction:column;gap:16px}
.screen.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}

h2{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-stretch:108%;font-size:16px;margin:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Coffre ---------- */
.vault{position:relative;display:grid;place-items:center;padding:8px 0 4px}
.vault svg{width:240px;height:240px;max-width:100%}
.vault .ring-bg{fill:none;stroke:var(--panel-2);stroke-width:16}
.vault .ring{fill:none;stroke:var(--volt);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.3,.9,.3,1);filter:drop-shadow(0 0 8px #C6FF4D66)}
.vault .ticks line{stroke:var(--line);stroke-width:2}
.vault .door{transform-origin:120px 120px;transition:transform 1s cubic-bezier(.3,.9,.3,1)}
.vault-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.vault-center .amount{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:108%;font-size:38px;line-height:1;color:var(--volt);font-variant-numeric:tabular-nums}
.vault-center .of{font-size:13px;color:var(--muted);margin-top:4px}
.vault-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-stretch:110%;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat.loss b{color:var(--loss)}

/* ---------- Listes d'exercices ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.task{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.task.weak{border-color:#C6FF4D55}
.task .name{font-weight:600;min-width:0}
.task .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.price{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:112%;font-size:20px;color:var(--volt);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--volt);border-radius:6px;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.task-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.chip.volt{background:var(--volt-dim);color:var(--volt)}
.chip.wait{background:#FFC94D1f;color:#FFC94D}
.chip.loss{background:#FF5C4D1f;color:var(--loss)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;background:var(--panel-2);border:1px solid var(--line);transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--volt);color:var(--ink);border-color:var(--volt)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row .grow{flex:1;min-width:0}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-style:italic;background:var(--panel-2);border:2px solid var(--line);color:var(--fg)}
.avatar.volt{border-color:var(--volt);color:var(--volt)}
.split{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hr{height:1px;background:var(--line)}
.note{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:12px;padding:10px 12px}
.note b{color:var(--fg)}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.search input::placeholder{color:var(--muted)}
.tabs-inline{display:flex;gap:6px;flex-wrap:wrap}
.tabs-inline button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.tabs-inline button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt)}

.proof-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted);font-size:13px;max-width:100%}

/* ---------- Barre d'onglets ---------- */
nav.tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:#0B0D0Af2;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button[aria-current="page"]{color:var(--volt)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--volt);color:var(--ink);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* ---------- Feuilles / modales ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:30;background:#000a;display:flex;align-items:flex-end;animation:fade .2s ease both}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.9,.3,1) both}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input[type=text],.field input[type=number],.field select{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input[type=range]{width:100%;accent-color:var(--volt)}
.big-amount{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:118%;font-size:52px;line-height:1;color:var(--volt);text-align:center;font-variant-numeric:tabular-nums}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.edit-task{display:grid;grid-template-columns:1fr 84px;gap:8px;align-items:center;background:var(--panel-2);border-radius:14px;padding:10px 12px}
.edit-task input{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;text-align:right;font-variant-numeric:tabular-nums}
.edit-task .meta{font-size:12px;color:var(--muted)}
.budget{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px}
.budget.ok{background:var(--volt-dim);color:var(--volt)}
.budget.ko{background:#FF5C4D1f;color:var(--loss)}

/* ---------- Toast + pièces ---------- */
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:60;background:var(--volt);color:var(--ink);font-weight:700;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #000a;animation:toast 2.6s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translateY(20px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(10px)}}
.coin{position:absolute;z-index:55;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EFFFC2,var(--volt) 55%,#7DB800);box-shadow:0 0 10px #C6FF4D99;pointer-events:none;display:grid;place-items:center;font:900 12px/1 var(--display);color:var(--ink)}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.role-pick{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.role-card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,transform .2s}
.role-card:hover{border-color:var(--volt);transform:translateY(-2px)}
.role-card b{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:118%;font-size:24px}
.role-card span{color:var(--muted);font-size:14px}
.hero-line{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:120%;font-size:38px;line-height:.95;letter-spacing:-.02em;margin:14px 0 0}
.hero-line em{font-style:italic;color:var(--volt)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------- Encaissement : animation quand le sportif reçoit de l'argent ---------- */
.cele{position:absolute;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 42%,#1d2b10 0%,#0B0D0Af0 62%);animation:fade .25s ease both;overflow:hidden}
.cele-rays{position:absolute;left:50%;top:42%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,#C6FF4D1c 0deg 9deg,transparent 9deg 22deg);border-radius:50%;animation:rays 9s linear infinite;mask-image:radial-gradient(circle,#000 0 30%,transparent 62%);-webkit-mask-image:radial-gradient(circle,#000 0 30%,transparent 62%)}
@keyframes rays{to{transform:rotate(360deg)}}
.cele-card{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px;animation:celeIn .7s cubic-bezier(.2,1.5,.4,1) both}
@keyframes celeIn{from{transform:scale(.4) translateY(40px);opacity:0}}
.cele-vault{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--volt);color:var(--ink);box-shadow:0 0 0 10px #C6FF4D22,0 0 60px #C6FF4D88;animation:celeDial 1.1s cubic-bezier(.3,1.4,.4,1) both .1s}
.cele-vault svg{width:60px;height:60px}
@keyframes celeDial{from{transform:rotate(-260deg) scale(.6)}}
.cele-amt{font-family:var(--display);font-weight:900;font-style:italic;font-stretch:122%;font-size:68px;line-height:1;color:var(--volt);font-variant-numeric:tabular-nums;text-shadow:0 0 30px #C6FF4D88;letter-spacing:-.02em}
.cele-lines{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg);max-height:120px;overflow:auto}
.cele-lines span{color:var(--muted)}
.cele .btn{margin-top:10px}
.cele.out .cele-card{animation:celeOut .45s cubic-bezier(.6,0,.4,1) both}
.cele.out{animation:fadeOut .45s ease both .15s}
@keyframes celeOut{to{transform:translateY(-120px) scale(.3);opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.rain{position:absolute;top:-30px;z-index:1;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#EFFFC2,var(--volt) 55%,#7DB800);box-shadow:0 0 10px #C6FF4D88;display:grid;place-items:center;font:900 12px/1 var(--display);color:var(--ink);pointer-events:none}
.vault.boom .ring{filter:drop-shadow(0 0 22px #C6FF4D)}

/* ---------- Divers app ---------- */
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.top-right{display:flex;align-items:center;gap:8px}
.mode-pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:#FFC94D;border-radius:999px;padding:3px 8px}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--volt);color:var(--volt);background:var(--volt-dim)}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{accent-color:var(--volt);width:18px;height:18px}
.err{color:var(--loss);font-size:13px;min-height:1em}
.del{color:var(--muted);font-size:18px;line-height:1;padding:4px 6px}
.edit-task{grid-template-columns:1fr 84px auto}
.loading{display:grid;place-items:center;height:100%;color:var(--muted)}
.copy{display:flex;gap:8px;align-items:center}
.copy code{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--volt);overflow:hidden;text-overflow:ellipsis}
.vid-wrap{position:relative}
.vid-play{position:absolute;inset:auto 12px 12px auto;display:inline-flex;align-items:center;gap:8px;background:#0B0D0Ae6;border:1px solid var(--volt);color:var(--volt);border-radius:999px;padding:8px 14px 8px 8px;font-weight:700;font-size:13px}
.vid-play span{width:26px;height:26px;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;font-size:11px}
video.proof-img{background:#000;object-fit:contain}

/* ---------- Messagerie ---------- */
.chat-screen{gap:0;min-height:100%}
.chat-head{position:sticky;top:-4px;margin-top:-4px;z-index:2;display:flex;align-items:center;gap:12px;padding:8px 0 12px;background:var(--ink);border-bottom:1px solid var(--line)}
.chat-head .avatar{width:40px;height:40px}
.msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:14px 0 10px}
.day{display:flex;justify-content:center;margin:10px 0 4px}
.day span{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.bubble{max-width:80%;padding:8px 11px 6px;border-radius:16px;font-size:15px;line-height:1.35;animation:bub .25s cubic-bezier(.2,1.3,.4,1) both;overflow-wrap:anywhere}
.bubble.them{align-self:flex-start;background:var(--panel-2);border-bottom-left-radius:5px}
.bubble.me{align-self:flex-end;background:var(--volt);color:var(--ink);border-bottom-right-radius:5px}
.bubble .meta{display:flex;justify-content:flex-end;gap:4px;font-size:10px;opacity:.65;margin-top:2px;font-variant-numeric:tabular-nums}
.bubble .ticks{letter-spacing:-3px;padding-right:3px}
.bubble .ticks.seen{opacity:1;font-weight:900}
@keyframes bub{from{transform:translateY(6px) scale(.96);opacity:0}}
.seen-line{align-self:flex-end;font-size:11px;color:var(--muted);margin-top:-2px}
.chat-empty{margin:auto;text-align:center;color:var(--fg);padding:40px 10px;line-height:1.6}
.composer{position:sticky;bottom:-24px;margin-bottom:-24px;display:flex;gap:8px;align-items:center;padding:10px 0 34px;background:var(--ink)}
.composer input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:11px 16px}
.composer input::placeholder{color:var(--muted)}
.send{width:44px;height:44px;flex:none;border-radius:50%;background:var(--volt);color:var(--ink);display:grid;place-items:center;transition:transform .12s}
.send:active{transform:scale(.9)}
.send svg{width:20px;height:20px}
.chat-row{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);width:100%}
.chat-row .preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-row.unread .preview{color:var(--fg);font-weight:600}
.chat-row .dot{width:10px;height:10px;border-radius:50%;background:var(--volt);flex:none;box-shadow:0 0 8px #C6FF4D}
.chat-list{gap:0}
.chat-row .grow{flex:1;min-width:0}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <div class="splash" id="splash" aria-hidden="true">
      <div class="dial">
        <svg viewBox="0 0 150 150" aria-hidden="true">
          <circle cx="75" cy="75" r="66" fill="none" stroke="#0B0D0A" stroke-width="8"/>
          <g stroke="#0B0D0A" stroke-width="3">

<script>
(() => {
  /* =====================================================================
     Outils
     ===================================================================== */
  const euro = n => { const v = Math.round((n || 0) * 100) / 100; return v.toLocaleString("fr-FR", { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 }) + " €"; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const initials = n => (n || "?").trim().split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
  const first = n => (n || "").trim().split(/\s+/)[0] || "";
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const now = () => Date.now();
  const monthName = () => new Date().toLocaleDateString("fr-FR", { month: "long" });
  const daysLeft = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - d.getDate(); };
  const cleanHandle = h => (h || "").toLowerCase().replace(/^@/, "").replace(/[^a-z0-9._]/g, "").slice(0, 20);
  const earned = t => t.earned ?? t.value * t.done;            // argent déjà rendu sur cet exercice (acquis)
  const recovered = p => (p?.tasks || []).reduce((a, t) => a + earned(t), 0);
  const left = t => Math.max(0, t.target - t.done);              // séances encore à valider
  const SPORTS = ["Remise en forme", "Musculation", "Course à pied", "Yoga & mobilité", "Boxe", "Pilates", "Natation", "Autre"];

  /* =====================================================================
     Base locale pour le mode démo (même interface que la vraie base)
     ===================================================================== */
  const DEMO_KEY = "vaultr-demo-v3";
  function demoSeed() {
    const t0 = now() - 86400000 * 9;
    const P = {};
    const coach = (id, name, handle, city, sport, price) => P["profiles/" + id] = { role: "coach", name, handle, city, sport, price, boostedUntil: 0, pro: false, createdAt: t0 };
    coach("demo_karim", "Karim Benali", "karim.fit", "Nice", "Remise en forme", 150);
    coach("demo_ines", "Inès Morel", "ines.yoga", "Nice", "Yoga & mobilité", 120);
    coach("demo_theo", "Théo Garnier", "theo.run", "Nice", "Course à pied", 90);
    coach("demo_nadia", "Nadia Haddad", "nadia.boxe", "Antibes", "Boxe", 160);
    coach("demo_jade", "Jade Rossi", "jade.pilates", "Nice", "Pilates", 110);
    const ath = (id, name, handle, goal) => P["profiles/" + id] = { role: "athlete", name, handle, city: "Nice", goal, createdAt: t0 };
    ath("demo_lea", "Léa Martin", "lea.run", "Remise en forme");
    ath("demo_tom", "Tom Lefèvre", "tom.l", "Perte de poids");
    ath("demo_yanis", "Yanis Cohen", "yanis.c", "Prise de muscle");
    const task = (name, detail, value, done, diff, weak) => ({ id: rid(), name, detail, value, target: 8, done, earned: value * done, diff, weak });
    P["programs/demo_lea"] = { athleteId: "demo_lea", coachId: "demo_karim", mise: 50, coachFee: 150, createdAt: t0, tasks: [
      task("Course 15 min", "Échauffement inclus", 2, 3, 1, false),
      task("15 pompes", "Ton point faible 😈", 3, 3, 3, true),
      task("Gainage 3 × 1 min", "Planche ventrale", 1.25, 3, 2, false)] };
    P["programs/demo_tom"] = { athleteId: "demo_tom", coachId: "demo_karim", mise: 30, coachFee: 150, createdAt: t0, tasks: [
      task("Marche rapide 30 min", "", 1.5, 6, 1, false), task("20 squats", "", 2.25, 6, 2, true)] };
    P["programs/demo_yanis"] = { athleteId: "demo_yanis", coachId: "demo_karim", mise: 80, coachFee: 150, createdAt: t0, tasks: [
      task("Développé couché 4 × 10", "", 5, 2, 3, true), task("Tractions 3 × 8", "", 5, 2, 3, false)] };
    const ev = (aid, label, amount, ago) => P["events/" + rid()] = { athleteId: aid, coachId: "demo_karim", label, amount, ts: now() - ago };
    ev("demo_lea", "Mise + coaching du mois (simulé)", -200, 86400000 * 9);
    const chat = (aid, msgs) => {
      const id = aid + "__demo_karim"; let last = null;
      msgs.forEach(([from, text, ago]) => { const m = { from, text, ts: now() - ago }; P[`chats/${id}/messages/${rid()}`] = m; last = m; });
      P["chats/" + id] = { athleteId: aid, coachId: "demo_karim", lastMsg: last.text, lastFrom: last.from, lastTs: last.ts, readBy: { demo_karim: last.from === "demo_karim" ? last.ts : 0, [aid]: last.ts } };
    };
    const H = 3600000;
    chat("demo_lea", [["demo_karim", "Salut Léa ! J'ai mis ton programme d'octobre en ligne 💪", 50 * H], ["demo_lea", "Top merci ! Les pompes à 3 €, t'es dur 😅", 49 * H], ["demo_karim", "C'est ton point faible, donc c'est là que ça paie 😈", 48.5 * H], ["demo_lea", "Je t'envoie la vidéo de ma série ce soir", 3 * H], ["demo_karim", "Parfait, je valide dès que je la reçois 👌", 2.8 * H]]);
    chat("demo_tom", [["demo_karim", "Tom, on décale la séance de jeudi à vendredi ?", 30 * H], ["demo_tom", "Ok pour vendredi 18h ! Je pourrai faire les squats à la maison mercredi ?", 1 * H]]);
    ["Course 15 min", "15 pompes", "Gainage 3 × 1 min"].forEach((n, i) => [7, 4, 2].forEach(d => ev("demo_lea", n + " validé", [2, 3, 1.25][i], 86400000 * d + i * 60000)));
    return P;
  }
  function makeLocalDb() {
    let data; try { data = JSON.parse(lsGet(DEMO_KEY)); } catch {} if (!data) data = demoSeed();
    const listeners = new Set();
    const isObj = v => v && typeof v === "object" && !Array.isArray(v);
    const deepMerge = (a, b) => { const o = { ...a }; for (const [k, v] of Object.entries(b)) o[k] = isObj(v) && isObj(o[k]) ? deepMerge(o[k], v) : v; return o; };
    const emit = () => { lsSet(DEMO_KEY, JSON.stringify(data)); setTimeout(() => listeners.forEach(fn => fn()), 0); };
    const clone = v => JSON.parse(JSON.stringify(v));
    const snap = path => ({ id: path.split("/").pop(), exists: path in data, data: () => (path in data ? clone(data[path]) : undefined), metadata: { fromCache: false, hasPendingWrites: false } });
    const parent = p => p.slice(0, p.lastIndexOf("/"));
    const test = (x, op, v) => op === "==" ? x === v : op === "!=" ? x !== v : op === "in" ? v.includes(x) : op === ">" ? x > v : op === "<" ? x < v : true;
    function query(col, filters = [], order = null, lim = null) {
      const run = () => {
        let docs = Object.keys(data).filter(p => parent(p) === col).map(snap).filter(s => filters.every(([f, op, v]) => test(s.data()[f], op, v)));
        if (order) { const [f, d] = order; docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x > y ? 1 : x < y ? -1 : 0) * (d === "desc" ? -1 : 1); }); }
        if (lim) docs = docs.slice(0, lim);
        return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
      };
      return {
        where: (f, op, v) => query(col, [...filters, [f, op, v]], order, lim),
        orderBy: (f, d = "asc") => query(col, filters, [f, d], lim),
        limit: n => query(col, filters, order, n),
        get: async () => run(),
        onSnapshot(next) { const fn = () => next(run()); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); }
      };
    }
    const docRef = path => ({
      id: path.split("/").pop(), path,
      get: async () => snap(path),
      set: async v => { data[path] = clone(v); emit(); },
      update: async v => { if (!(path in data)) throw { code: "invalid_argument", message: "absent" }; data[path] = deepMerge(data[path], clone(v)); emit(); },
      delete: async () => { delete data[path]; emit(); },
      onSnapshot(next) { const fn = () => next(snap(path)); listeners.add(fn); setTimeout(fn, 0); return () => listeners.delete(fn); },
      collection: sub => colRef(path + "/" + sub)
    });
    const colRef = col => Object.assign(query(col), { path: col, doc: id => docRef(col + "/" + (id || rid())), add: async v => { const r = docRef(col + "/" + rid()); await r.set(v); return r; } });
    return {
      doc: docRef,
      collection: colRef,
      reset() { data = demoSeed(); for (const k of Object.keys(localStorage || {})) if (k.startsWith("vaultr-seen-demo")) try { localStorage.removeItem(k); } catch {} emit(); }
    };
  }

  /* =====================================================================
     État de l'appli
     ===================================================================== */
  const A = {
    mode: "loading",          // loading | live | demo | blocked
    blockedWhy: "",
    db: null, liveDb: null, user: null,
    myId: null, suggestedName: "",
    demoAs: lsGet("vaultr-demo-as") || "demo_lea",
    profile: undefined,       // undefined = pas encore chargé, null = pas de profil
    coaches: [], athletes: {},
    program: undefined, proofsAth: [], events: [],
    clients: [], proofsCoach: [],
    chats: [], chat: null, msgs: [], chatWith: null,   // messagerie
    tab: { athlete: "vault", coach: "clients" },
    openClient: null, coachFilter: "Tous", coachQuery: "",
    onboardRole: null, busy: false
  };
  let unsubs = [], roleSubs = [], subscribedRole = null;
  const $main = document.getElementById("main");
  const $tabbar = document.getElementById("tabbar");
  const $phone = document.getElementById("phone");
  const $switch = document.getElementById("roleSwitch");
  const $settings = document.getElementById("settingsBtn");
  const $pill = document.getElementById("demoPill");

  const ICONS = {
    vault: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="4"/><path d="M12 8v1M12 15v1M8 12h1M15 12h1"/></svg>',
    coach: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l12-4 2 4"/><circle cx="16.5" cy="13.5" r="1.5"/></svg>',
    clients: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.5 0 4 1.5 4.5 4"/></svg>',
    proof: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M8 6l2-3h4l2 3"/><circle cx="12" cy="13" r="3.5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg>',
    pro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>'
  };
  const VAULT_ICON = '<svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="25" fill="none" stroke="currentColor" stroke-width="5"/><g stroke="currentColor" stroke-width="5" stroke-linecap="round"><line x1="30" y1="30" x2="30" y2="14"/><line x1="30" y1="30" x2="44" y2="38"/><line x1="30" y1="30" x2="16" y2="38"/></g><circle cx="30" cy="30" r="6" fill="currentColor"/></svg>';

  /* =====================================================================
     Effets : toast, pièces, compteur, encaissement
     ===================================================================== */
  function toast(msg) {
    document.querySelectorAll(".toast").forEach(t => t.remove());
    const t = document.createElement("div");
    t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
    $phone.appendChild(t); setTimeout(() => t.remove(), 2700);
  }
  function coinBurst(fromEl, amount) {
    if (reduced()) return;
    const pr = $phone.getBoundingClientRect();
    const r = fromEl ? fromEl.getBoundingClientRect() : { left: pr.left + pr.width / 2, top: pr.top + pr.height / 2, width: 0, height: 0 };
    const x0 = r.left - pr.left + r.width / 2, y0 = r.top - pr.top + r.height / 2;
    const n = Math.min(14, 4 + Math.round(amount * 2));
    for (let i = 0; i < n; i++) {
      const c = document.createElement("div");
      c.className = "coin"; c.textContent = "€";
      c.style.left = x0 - 11 + "px"; c.style.top = y0 - 11 + "px";
      $phone.appendChild(c);
      const a = (Math.PI * 2 * i) / n + Math.random() * .5, d = 50 + Math.random() * 60;
      c.animate([
        { transform: "translate(0,0) scale(.4)", opacity: 1 },
        { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - 40}px) scale(1.1)`, opacity: 1, offset: .45 },
        { transform: `translate(${Math.cos(a) * d * .6}px,${-y0 + 70}px) scale(.3)`, opacity: 0 }
      ], { duration: 1100 + Math.random() * 300, easing: "cubic-bezier(.3,.7,.3,1)" }).onfinish = () => c.remove();
    }
  }
  function countUp(el, from, to, dur = 900, sign = "") {
    if (!el) return;
    if (reduced() || from === to) { el.textContent = sign + euro(to); return; }
    const t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = sign + euro(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  // Écran plein « tu as reçu de l'argent » : pluie de pièces + montant qui grimpe + encaissement.
  let cele = null;
  function celebrate(amount, lines) {
    if (amount <= 0) return;
    if (cele) { // un autre gain arrive pendant l'écran : on additionne
      const from = cele.total; cele.total += amount; cele.lines.push(...lines);
      countUp(cele.el.querySelector(".cele-amt"), from, cele.total, 600, "+");
      cele.el.querySelector(".cele-lines").innerHTML = cele.lines.slice(-4).map(l => `<div>${esc(l)}</div>`).join("");
      rain(cele.el, 14); return;
    }
    const el = document.createElement("div");
    el.className = "cele"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Argent récupéré");
    el.innerHTML = `<div class="cele-rays"></div>
      <div class="cele-card">
        <div class="cele-vault">${VAULT_ICON}</div>
        <div class="eyebrow" style="color:var(--volt)">Argent récupéré</div>
        <div class="cele-amt">+0 €</div>
        <div class="cele-lines">${lines.slice(-4).map(l => `<div>${esc(l)}</div>`).join("")}</div>
        <button type="button" class="btn primary wide" data-cele-ok>Encaisser dans mon coffre</button>
      </div>`;
    $phone.appendChild(el);
    cele = { el, total: amount, lines: [...lines] };
    setTimeout(() => countUp(el.querySelector(".cele-amt"), 0, amount, 1100, "+"), 250);
    rain(el, 36);
    try { if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.([30, 50, 30, 50, 60]); } catch {}
    el.querySelector("[data-cele-ok]").focus({ preventScroll: true });
    el.addEventListener("click", e => { if (e.target.closest("[data-cele-ok]")) closeCele(); });
  }
  function rain(host, n) {
    if (reduced()) return;
    const w = $phone.clientWidth, h = $phone.clientHeight;
    for (let i = 0; i < n; i++) {
      const c = document.createElement("div");
      c.className = "rain"; c.textContent = "€";
      c.style.left = Math.random() * (w - 24) + "px";
      host.appendChild(c);
      const rot = (Math.random() * 2 - 1) * 540, drift = (Math.random() * 2 - 1) * 60;
      c.animate([
        { transform: "translate(0,0) rotate(0) scale(.8)", opacity: 0 },
        { opacity: 1, offset: .1 },
        { transform: `translate(${drift}px,${h + 60}px) rotate(${rot}deg) scale(1.1)`, opacity: 1 }
      ], { duration: 1400 + Math.random() * 1300, delay: Math.random() * 900, easing: "cubic-bezier(.4,.1,.7,1)", fill: "both" }).onfinish = () => c.remove();
    }
  }
  function closeCele() {
    if (!cele) return;
    const { el, total } = cele; cele = null;
    el.classList.add("out");
    setTimeout(() => {
      el.remove();
      if (A.profile?.role === "athlete") {
        if (A.tab.athlete !== "vault") { A.tab.athlete = "vault"; render(); }
        const box = document.getElementById("vaultBox");
        if (box) { coinBurst(box, total); box.classList.add("boom"); setTimeout(() => box.classList.remove("boom"), 1200); }
      }
    }, 450);
  }

  /* =====================================================================
     Démarrage : vrai compte (base partagée) ou démo
     ===================================================================== */
  async function boot() {
    const use = window.claude?.use?.bind(window.claude);
    let db = null, user = null;
    if (use) { try { [db, user] = await Promise.all([use("db"), use("user")]); } catch {} }
    if (db && user) {
      const me = await user.me();
      A.liveDb = db; A.user = user;
      if (!me.id) { A.mode = "blocked"; A.blockedWhy = "signin"; return render(); }
      const canWrite = await user.can("data.write");
      if (canWrite === false) { A.mode = "blocked"; A.blockedWhy = "write"; return render(); }
      A.liveId = me.id; A.suggestedName = me.name || "";
      if (lsGet("vaultr-mode") === "demo") return startDemo();
      return startLive();
    }
    startDemo();
  }
  function startLive() {
    A.mode = "live"; A.db = A.liveDb; A.myId = A.liveId; lsSet("vaultr-mode", "live");
    resetData(); subscribeBase(); render();
  }
  function startDemo() {
    A.mode = "demo"; A.db = A.demoDb || (A.demoDb = makeLocalDb()); lsSet("vaultr-mode", "demo");
    A.myId = A.demoAs; resetData(); subscribeBase(); render();
  }
  function resetData() {
    unsubs.forEach(u => u()); roleSubs.forEach(u => u()); unsubs = []; roleSubs = []; subscribedRole = null;
    Object.assign(A, { profile: undefined, coaches: [], athletes: {}, program: undefined, proofsAth: [], events: [], clients: [], proofsCoach: [], openClient: null, onboardRole: null, chats: [], chat: null, msgs: [], chatWith: null });
    closeChatSub(); prevChatTs = {};
    seenTs = null; lastVault = null;
  }
  const onErr = e => { if (e?.code === "revoked") { A.mode = "blocked"; A.blockedWhy = "revoked"; render(); } };
  function subscribeBase() {
    const db = A.db;
    unsubs.push(db.doc("profiles/" + A.myId).onSnapshot(s => {
      A.profile = s.exists ? { id: s.id, ...s.data() } : null;
      if (A.profile?.role !== subscribedRole) subscribeRole(A.profile?.role || null);
      schedule();
    }, onErr));
    unsubs.push(db.collection("profiles").where("role", "==", "coach").onSnapshot(q => {
      A.coaches = q.docs.map(d => ({ id: d.id, ...d.data() })); schedule();
    }, onErr));
  }
  function subscribeRole(role) {
    roleSubs.forEach(u => u()); roleSubs = []; subscribedRole = role;
    const db = A.db, id = A.myId;
    if (role === "athlete") {
      roleSubs.push(db.doc("programs/" + id).onSnapshot(s => {
        A.program = s.exists ? s.data() : null;
        if (A.program?.coachId) openChatSub(chatId(id, A.program.coachId)); else closeChatSub();
        schedule();
      }, onErr));
      roleSubs.push(db.collection("proofs").where("athleteId", "==", id).onSnapshot(q => { A.proofsAth = q.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, onErr));
      roleSubs.push(db.collection("events").where("athleteId", "==", id).orderBy("ts", "desc").limit(40).onSnapshot(q => {
        A.events = q.docs.map(d => ({ id: d.id, ...d.data() })); checkNewMoney(); schedule();
      }, onErr));
    } else if (role === "coach") {
      roleSubs.push(db.collection("programs").where("coachId", "==", id).onSnapshot(q => { A.clients = q.docs.map(d => ({ id: d.id, ...d.data() })); schedule(); }, onErr));
      roleSubs.push(db.collection("profiles").where("role", "==", "athlete").onSnapshot(q => { A.athletes = Object.fromEntries(q.docs.map(d => [d.id, { id: d.id, ...d.data() }])); schedule(); }, onErr));
      roleSubs.push(db.collection("proofs").where("coachId", "==", id).onSnapshot(q => { A.proofsCoach = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.ts - a.ts); schedule(); }, onErr));
      roleSubs.push(db.collection("chats").where("coachId", "==", id).onSnapshot(q => {
        A.chats = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.lastTs || 0) - (a.lastTs || 0));
        // notification quand un client écrit dans une autre conversation
        for (const c of A.chats) {
          const before = prevChatTs[c.id];
          if (before !== undefined && c.lastTs > before && c.lastFrom !== A.myId && !viewingChat(c.id)) toast(`💬 ${first(athleteName(c.athleteId))} : ${c.lastMsg}`);
          prevChatTs[c.id] = c.lastTs || 0;
        }
        schedule();
      }, onErr));
    }
  }

  // Détecte l'argent reçu depuis la dernière visite (même appli fermée) et lance l'encaissement.
  let seenTs = null;
  function checkNewMoney() {
    const key = `vaultr-seen-${A.mode}-${A.myId}`;
    const newest = A.events.reduce((m, e) => Math.max(m, e.ts || 0), 0);
    if (seenTs === null) {
      const stored = lsGet(key);
      seenTs = stored !== null ? +stored : newest; // premier passage sur cet appareil : on ne fête pas l'historique
      if (stored === null) lsSet(key, String(seenTs));
    }
    const fresh = A.events.filter(e => e.amount > 0 && e.ts > seenTs).sort((a, b) => a.ts - b.ts);
    if (!fresh.length) return;
    seenTs = Math.max(seenTs, newest); lsSet(key, String(seenTs));
    const coach = A.coaches.find(c => c.id === fresh[0].coachId);
    const who = first(coach?.name) || "Ton coach";
    celebrate(fresh.reduce((a, e) => a + e.amount, 0), fresh.map(e => `${who} a validé : ${e.label.replace(/ validé.*$/, "")} · +${euro(e.amount)}`));
  }

  /* =====================================================================
     Messagerie coach ⇄ client : chats/<sportif>__<coach>/messages/*
     ===================================================================== */
  const chatId = (aid, cid) => aid + "__" + cid;
  let chatSub = null, prevChatTs = {}, markingRead = false;
  function closeChatSub() { if (chatSub) { chatSub.unsubs.forEach(u => u()); chatSub = null; } A.chat = null; A.msgs = []; }
  function openChatSub(id) {
    if (chatSub?.id === id) return;
    closeChatSub();
    const sub = chatSub = { id, unsubs: [], baseline: null };
    sub.unsubs.push(A.db.doc("chats/" + id).onSnapshot(s => { if (chatSub !== sub) return; A.chat = s.exists ? { id, ...s.data() } : null; schedule(); }, onErr));
    sub.unsubs.push(A.db.collection(`chats/${id}/messages`).orderBy("ts", "desc").limit(120).onSnapshot(q => {
      if (chatSub !== sub) return;
      A.msgs = q.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
      const newest = A.msgs.length ? A.msgs[A.msgs.length - 1] : null;
      if (sub.baseline !== null && newest && newest.ts > sub.baseline && newest.from !== A.myId && !viewingChat(id) && A.profile?.role === "athlete")
        toast(`💬 ${first(myCoach()?.name) || "Ton coach"} : ${newest.text}`);
      sub.baseline = newest?.ts || 0;
      schedule();
    }, onErr));
  }
  function viewingChat(id) {
    const role = A.profile?.role;
    if (role === "athlete") return A.tab.athlete === "chat" && !!A.program && chatId(A.myId, A.program.coachId) === id;
    if (role === "coach") return A.tab.coach === "chat" && !!A.chatWith && chatId(A.chatWith, A.myId) === id;
    return false;
  }
  async function sendMessage(text) {
    const role = A.profile.role;
    const aid = role === "athlete" ? A.myId : A.chatWith, cid = role === "athlete" ? A.program.coachId : A.myId;
    const id = chatId(aid, cid), ts = now();
    await A.db.collection(`chats/${id}/messages`).add({ from: A.myId, text, ts });
    const meta = { athleteId: aid, coachId: cid, lastMsg: text.slice(0, 120), lastFrom: A.myId, lastTs: ts };
    const ref = A.db.doc("chats/" + id);
    if ((await ref.get()).exists) await ref.update({ ...meta, readBy: { [A.myId]: ts } });
    else await ref.set({ ...meta, readBy: { [A.myId]: ts } });
  }
  async function markRead() {
    const c = A.chat; if (!c || markingRead || !viewingChat(c.id)) return;
    if ((c.readBy?.[A.myId] || 0) >= (c.lastTs || 0)) return;
    markingRead = true;
    try { await A.db.doc("chats/" + c.id).update({ readBy: { [A.myId]: c.lastTs } }); } catch {} finally { markingRead = false; }
  }
  const unreadIn = (msgs, readTs) => msgs.filter(m => m.from !== A.myId && m.ts > (readTs || 0)).length;
  const chatUnread = c => c.lastFrom !== A.myId && (c.lastTs || 0) > (c.readBy?.[A.myId] || 0);

  /* =====================================================================
     Actions (écrivent dans la base, la vue suit toute seule)
     ===================================================================== */
  async function guard(fn, okMsg) {
    if (A.busy) return; A.busy = true;
    try { await fn(); if (okMsg) toast(okMsg); }
    catch (e) {
      const c = e?.code;
      toast(c === "quota_exceeded" ? "L'espace de stockage de Vaultr est plein." : c === "resource_exhausted" ? "Trop d'actions d'un coup, réessaie dans un instant." : c === "invalid_argument" ? "Action refusée : tu n'as pas le droit de modifier ces données." : "Ça n'a pas marché. Vérifie ta connexion et réessaie.");
    } finally { A.busy = false; }
  }
  const progRef = aid => A.db.doc("programs/" + aid);

  async function createProfile(f) {
    const handle = cleanHandle(f.handle);
    if (!f.name.trim()) throw { ui: "Indique ton prénom et ton nom." };
    if (handle.length < 3) throw { ui: "Ton @tag doit faire au moins 3 caractères (lettres, chiffres, point)." };
    const taken = await A.db.collection("profiles").where("handle", "==", handle).limit(2).get();
    if (taken.docs.some(d => d.id !== A.myId)) throw { ui: `Le tag @${handle} est déjà pris.` };
    const base = { role: f.role, name: f.name.trim().slice(0, 40), handle, city: f.city.trim().slice(0, 40), createdAt: now() };
    await A.db.doc("profiles/" + A.myId).set(f.role === "coach"
      ? { ...base, sport: f.sport, price: Math.max(0, Math.round(+f.price || 0)), boostedUntil: 0, pro: false }
      : { ...base, goal: f.goal });
  }
  async function addCoach(c) {
    const ref = progRef(A.myId), s = await ref.get();
    if (s.exists) await ref.update({ coachId: c.id, coachFee: c.price || 0 });
    else await ref.set({ athleteId: A.myId, coachId: c.id, mise: 0, coachFee: c.price || 0, tasks: [], createdAt: now() });
  }
  async function setMise(v) {
    const p = A.program;
    const tasks = (p.tasks || []).map(t => ({ ...t }));
    const restOld = Math.max(0, p.mise - recovered(p)), restNew = Math.max(0, v - recovered(p));
    if (p.mise > 0 && tasks.length) fitBudget(tasks, tasks.map(t => restOld ? t.value * restNew / restOld : t.value), v).forEach((x, i) => tasks[i].value = x);
    await progRef(A.myId).update({ mise: v, tasks });
    await A.db.collection("events").add({ athleteId: A.myId, coachId: p.coachId, label: `Mise ${euro(v)} + coaching ${euro(p.coachFee)} (simulé)`, amount: -(v + (p.coachFee || 0)), ts: now() });
  }
  // Une vidéo est trop lourde pour un seul document : on la range en morceaux sous proofs/<id>/chunks.
  const CHUNK = 190000;
  async function sendProof(taskId, media, onProgress) {
    const p = A.program, t = p.tasks.find(x => x.id === taskId);
    const ref = A.db.collection("proofs").doc();
    const base = { athleteId: A.myId, coachId: p.coachId, taskId, taskName: t?.name || "", value: t?.value || 0, status: "pending", ts: now() };
    if (media.video) {
      const parts = [];
      for (let i = 0; i < media.video.length; i += CHUNK) parts.push(media.video.slice(i, i + CHUNK));
      for (let i = 0; i < parts.length; i++) {
        await ref.collection("chunks").doc(String(i).padStart(3, "0")).set({ d: parts[i] });
        onProgress?.((i + 1) / parts.length);
      }
      await ref.set({ ...base, kind: "video", mime: media.mime, chunks: parts.length, poster: media.poster || "", duration: media.duration || 0 });
    } else await ref.set({ ...base, kind: "photo", img: media.img });
  }
  async function loadVideo(pr) {
    const snaps = await Promise.all(Array.from({ length: pr.chunks }, (_, i) => A.db.doc(`proofs/${pr.id}/chunks/${String(i).padStart(3, "0")}`).get()));
    if (snaps.some(s => !s.exists)) throw { ui: "La vidéo n'est plus disponible." };
    const b64 = snaps.map(s => s.data().d).join(""), mime = pr.mime || "video/webm";
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { url: URL.createObjectURL(new Blob([bytes], { type: mime })), fallback: `data:${mime};base64,${b64}` };
  }
  async function dropVideo(pr) {
    if (pr.kind !== "video" || !pr.chunks) return;
    for (let i = 0; i < pr.chunks; i++) await A.db.doc(`proofs/${pr.id}/chunks/${String(i).padStart(3, "0")}`).delete().catch(() => {});
  }
  async function validateTask(aid, taskId, viaProof) {
    const s = await progRef(aid).get(); if (!s.exists) return null;
    const p = s.data(), tasks = p.tasks.map(t => ({ ...t })), t = tasks.find(x => x.id === taskId);
    if (!t || t.done >= t.target) return null;
    t.earned = Math.round((earned(t) + t.value) * 100) / 100; t.done++;
    await progRef(aid).update({ tasks });
    await A.db.collection("events").add({ athleteId: aid, coachId: A.myId, label: `${t.name} validé${viaProof ? " (preuve)" : ""}`, amount: t.value, ts: now() });
    return t;
  }
  async function reviewProof(pr, ok) {
    if (ok) await validateTask(pr.athleteId, pr.taskId, true);
    await A.db.doc("proofs/" + pr.id).update({ status: ok ? "ok" : "ko", reviewedAt: now(), ...(pr.kind === "video" ? { chunks: 0, poster: "" } : {}) });
    await dropVideo(pr); // la vidéo est supprimée après la décision pour garder de la place
  }

  // Arrondit au centime et met le reste éventuel sur le point faible (ou le premier exercice)
  // L'argent déjà rendu est acquis : on ne répartit que ce qui reste de la mise sur les séances restantes.
  const planned = tasks => tasks.reduce((a, t) => a + earned(t) + t.value * left(t), 0);
  function fitBudget(tasks, vals, budget) {
    vals = vals.map(v => Math.max(0, Math.round(v * 100) / 100));
    const open = tasks.map((t, i) => i).filter(i => left(tasks[i]) > 0);
    if (!open.length) return vals;
    const k = open.find(i => tasks[i].weak) ?? open[0];
    const gap = budget - tasks.reduce((a, t, i) => a + earned(t) + vals[i] * left(t), 0);
    vals[k] = Math.max(0, Math.round((vals[k] + gap / left(tasks[k])) * 100) / 100);
    return vals;
  }
  const budgetOk = (tasks, budget) => Math.abs(planned(tasks) - budget) <= .1;
  function aiSplit(tasks, budget) {
    const rest = Math.max(0, budget - recovered({ tasks }));
    const w = tasks.map(t => t.diff * (t.weak ? 1.6 : 1));
    const denom = tasks.reduce((a, t, i) => a + w[i] * left(t), 0) || 1;
    return fitBudget(tasks, tasks.map((t, i) => left(t) ? rest * w[i] / denom : t.value), budget);
  }

  /* =====================================================================
     Rendu
     ===================================================================== */
  let rafQueued = false, lastKey = "", lastVault = null;
  function schedule() { if (!rafQueued) { rafQueued = true; requestAnimationFrame(() => { rafQueued = false; render(); }); } }

  function render() {
    const role = A.profile?.role;
    const ready = A.mode === "live" || A.mode === "demo";
    $pill.hidden = A.mode !== "demo";
    $switch.hidden = A.mode !== "demo";
    $switch.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.role === "athlete" ? "demo_lea" : "demo_karim") === A.myId)));
    $settings.hidden = !ready || !A.profile;
    $tabbar.hidden = !ready || !role;

    let html, key;
    if (A.mode === "loading") { html = `<div class="loading">Ouverture du coffre…</div>`; key = "loading"; }
    else if (A.mode === "blocked") { html = viewBlocked(); key = "blocked"; }
    else if (A.profile === undefined) { html = `<div class="loading">Chargement de ton compte…</div>`; key = "loading"; }
    else if (!A.profile) { html = viewOnboard(); key = "onboard" + (A.onboardRole || ""); }
    else {
      renderTabs(role);
      const v = A.tab[role];
      const views = { athlete: { vault: viewVault, chat: viewChatAthlete, coach: viewFindCoach, wallet: viewWallet }, coach: { clients: viewClients, chat: viewChatsCoach, proofs: viewProofs, pro: viewPro } };
      html = views[role][v](); key = A.mode + A.myId + role + v + (A.openClient || "") + (v === "chat" ? A.chatWith || "" : "");
    }

    // garde la saisie en cours (un autre téléphone peut déclencher un rendu pendant qu'on tape)
    const act = document.activeElement, actId = $main.contains(act) ? act.id : null;
    const sel = actId && "selectionStart" in act ? [act.selectionStart, act.selectionEnd] : null;
    const kept = {}; $main.querySelectorAll("input[id],select[id],textarea[id]").forEach(i => kept[i.id] = i.type === "checkbox" ? i.checked : i.value);
    const keepScroll = key === lastKey ? $main.scrollTop : 0;

    $main.innerHTML = html.replace("screen ENTER", key !== lastKey ? "screen enter" : "screen");
    if (key === lastKey) {
      for (const [id, v] of Object.entries(kept)) { const i = document.getElementById(id); if (i && i.type !== "file") { if (i.type === "checkbox") i.checked = v; else i.value = v; } }
      $main.scrollTop = keepScroll;
    }
    if (actId) { const i = document.getElementById(actId); if (i) { i.focus({ preventScroll: true }); if (sel) try { i.setSelectionRange(...sel); } catch {} } }
    lastKey = key;
    afterRender();
  }

  function renderTabs(role) {
    const tabs = role === "athlete"
      ? [["vault", "Mon coffre", ICONS.vault], ["chat", "Messages", ICONS.chat], ["coach", "Coach", ICONS.coach], ["wallet", "Paiements", ICONS.wallet]]
      : [["clients", "Clients", ICONS.clients], ["chat", "Messages", ICONS.chat], ["proofs", "Preuves", ICONS.proof], ["pro", "Visibilité", ICONS.pro]];
    const cur = A.tab[role];
    const badges = {
      proofs: A.proofsCoach.filter(p => p.status === "pending").length,
      chat: role === "athlete" ? (viewingChat(A.chat?.id) ? 0 : unreadIn(A.msgs, A.chat?.readBy?.[A.myId])) : A.chats.filter(c => chatUnread(c) && !viewingChat(c.id)).length
    };
    $tabbar.innerHTML = tabs.map(([id, label, ic]) =>
      `<button type="button" data-tab="${id}" ${id === cur ? 'aria-current="page"' : ""}>${ic}${label}${badges[id] ? `<span class="badge">${badges[id]}</span>` : ""}</button>`).join("");
  }

  /* ---------- Accès impossible ---------- */

      write: "Tu peux voir Vaultr, mais pas encore l'utiliser : demande au propriétaire de te donner l'accès « Éditeur » (ou « Contributeur ») depuis le menu Partager.",

    }[A.blockedWhy] || "";

        ${coach ? `

        <div class="field"><label for="obPrice">Prix du coaching (€ / mois)</label><input type="number" id="obPrice" min="0" step="5" value="150"></div>`
        : `<div class="field"><label for="obGoal">Ton objectif</label><select id="obGoal">${["Remise en forme", "Perte de poids", "Prise de muscle", "Endurance", "Bien-être"].map(s => `<option>${s}</option>`).join("")}</select></div>`}
        <div class="err" id="obErr" role="alert"></div>

  }

  /* ---------- Sportif : coffre ---------- */
  function vaultSVG(pct) {
    const C = 2 * Math.PI * 96;
    const ticks = Array.from({ length: 36 }, (_, i) => {
      const a = (i / 36) * Math.PI * 2, r1 = 112, r2 = i % 3 ? 116 : 119;
      return `<line x1="${120 + Math.cos(a) * r1}" y1="${120 + Math.sin(a) * r1}" x2="${120 + Math.cos(a) * r2}" y2="${120 + Math.sin(a) * r2}"/>`;
    }).join("");
    return `<svg viewBox="0 0 240 240" aria-hidden="true">
      <g class="ticks door" id="door" style="transform:rotate(${pct * 180}deg)">${ticks}</g>
      <g><circle cx="120" cy="120" r="96" class="ring-bg"/>
      <circle cx="120" cy="120" r="96" class="ring" id="ring" transform="rotate(-90 120 120)" style="stroke-dasharray:${C};stroke-dashoffset:${C * (1 - pct)}"/></g>
    </svg>`;
  }
  const myCoach = () => A.coaches.find(c => c.id === A.program?.coachId);
  function viewVault() {
    const me = A.profile, p = A.program, coach = myCoach();
    const hello = `<div class="split"><div><div class="eyebrow">${esc(monthName())} · ${daysLeft()} jours restants</div><h2>Salut ${esc(first(me.name))} 👋</h2></div>
      ${coach ? `<span class="chip volt">Coach : ${esc(first(coach.name))}</span>` : ""}</div>`;
    if (p === undefined) return `<section class="screen ENTER">${hello}<div class="loading" style="height:200px">Chargement…</div></section>`;
    if (!p || !p.coachId) return `<section class="screen ENTER">${hello}
      <div class="vault" id="vaultBox">${vaultSVG(0)}<div class="vault-center"><div class="amount">0 €</div><div class="of">ton coffre est vide</div></div></div>
      <div class="card empty"><h3>Ajoute ton coach pour commencer</h3><p class="muted" style="margin:0">Trouve un coach sur Vaultr, ou ajoute le tien avec son @tag.</p>
      <button type="button" class="btn primary" data-goto="coach">Trouver mon coach</button></div></section>`;
    if (!p.mise) return `<section class="screen ENTER">${hello}
      <div class="vault" id="vaultBox">${vaultSVG(0)}<div class="vault-center"><div class="amount">0 €</div><div class="of">aucune mise ce mois-ci</div></div></div>
      <div class="card empty"><h3>Choisis ta mise du mois</h3><p class="muted" style="margin:0">Mets en jeu la somme que tu veux. ${esc(first(coach?.name) || "Ton coach")} la répartit sur tes exercices, et chaque exercice validé te la rend.</p>
      <button type="button" class="btn primary" data-open="mise">Choisir ma mise</button></div></section>`;
    const rec = recovered(p), shown = lastVault ?? rec, pct = Math.min(1, shown / p.mise);
    const tasks = p.tasks || [];
    return `<section class="screen ENTER">${hello}
      <div class="vault" id="vaultBox">${vaultSVG(pct)}
        <div class="vault-center"><div class="amount" id="recAmount">${euro(shown)}</div><div class="of">récupérés sur ${euro(p.mise)}</div></div></div>
      <div class="vault-stats">
        <div class="stat"><b>${euro(p.mise)}</b><span>Ma mise</span></div>

  /* ---------- Messagerie ---------- */
  const hhmm = ts => new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  function dayLabel(ts) {
    const d = new Date(ts), t = new Date(), y = new Date(t.getTime() - 86400000);
    if (d.toDateString() === t.toDateString()) return "Aujourd'hui";
    if (d.toDateString() === y.toDateString()) return "Hier";
    const l = d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    return l.charAt(0).toUpperCase() + l.slice(1);
  }
  function chatScreen({ name, sub, backBtn }) {
    const other = A.chat?.readBy ? Object.entries(A.chat.readBy).filter(([k]) => k !== A.myId).reduce((m, [, v]) => Math.max(m, v || 0), 0) : 0;
    const mine = A.msgs.filter(m => m.from === A.myId);
    const lastMine = mine[mine.length - 1];
    let day = "", html = "";
    for (const m of A.msgs) {
      const dl = dayLabel(m.ts);
      if (dl !== day) { day = dl; html += `<div class="day"><span>${esc(dl)}</span></div>`; }
      const me = m.from === A.myId;
      html += `<div class="bubble ${me ? "me" : "them"}"><div class="txt">${esc(m.text)}</div><div class="meta">${hhmm(m.ts)}${me ? `<span class="ticks ${other >= m.ts ? "seen" : ""}">✓✓</span>` : ""}</div></div>`;
    }
    const seen = lastMine && other >= lastMine.ts && A.msgs[A.msgs.length - 1] === lastMine;
    return `<section class="screen ENTER chat-screen">
      <div class="chat-head">${backBtn || ""}<div class="avatar volt">${esc(initials(name))}</div><div class="grow"><h3>${esc(name)}</h3><div class="muted" style="font-size:12px">${esc(sub)}</div></div></div>

      </form>
    </section>`;
  }
  function viewChatAthlete() {
